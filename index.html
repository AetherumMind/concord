<script id="OMNIAUTHOR_PLATFORM_CORE_V11">
(() => {
  const VERSION="v11";
  const BELIEFS="omniauthor-belief-ledger-v1";
  const ARTIFACTS="upfis-artifacts-v10";
  const WORLD="omniauthor-world-model-v11";
  const AGENTS="omniauthor-agent-runtime-v11";
  const PREDICTIONS="omniauthor-predictions-v11";
  const RUN="omniauthor-platform-auto-v11";

  const AGENT_NAMES=[
    "Architect","Scientist","Skeptic","Historian","Auditor",
    "Strategist","Dreamer","Cartographer","Synthesizer","Judge"
  ];

  function load(k,d=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
  function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
  function id(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
  function now(){return new Date().toISOString()}
  function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function words(t){return String(t||"").toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>4)}
  function relation(a,b){const w=words(a),bt=String(b||"").toLowerCase();return w.filter(x=>bt.includes(x)).length}

  function beliefs(){return load(BELIEFS,[])}
  function artifacts(){return load(ARTIFACTS,[])}
  function world(){return load(WORLD,{entities:{},relations:[],updated_at:now()})}
  function agents(){return load(AGENTS,{})}
  function predictions(){return load(PREDICTIONS,[])}

  function initAgents(){
    const a=agents();
    AGENT_NAMES.forEach(n=>{
      if(!a[n]) a[n]={
        name:n,trust:.72,wins:0,losses:0,cycles:0,
        specialty:{
          Architect:"structure",
          Scientist:"evidence",
          Skeptic:"failure modes",
          Historian:"precedent",
          Auditor:"consistency",
          Strategist:"usefulness",
          Dreamer:"hypothesis",
          Cartographer:"relationships",
          Synthesizer:"integration",
          Judge:"verdict"
        }[n]||"reasoning",
        memory:[]
      };
    });
    save(AGENTS,a);
    return a;
  }

  function validClaim(t){
    const s=String(t||"").trim();
    if(s.length<20)return false;
    if(/^https?:\/\//i.test(s))return false;
    if(/chrome menu|reload|settings|copy|paste|click|show me her/i.test(s))return false;
    return /\b(is|are|becomes|causes|requires|means|should|will|can|cannot|must|creates|supports|contradicts|preserves|improves|reduces|increases)\b/i.test(s);
  }

  function extractEntities(text){
    return [...new Set(words(text).slice(0,14))];
  }

  function updateWorldModel(belief){
    const wm=world();
    const ents=extractEntities(belief.text);
    ents.forEach(e=>{
      if(!wm.entities[e]) wm.entities[e]={id:e,count:0,beliefs:[],created_at:now()};
      wm.entities[e].count++;
      if(!wm.entities[e].beliefs.includes(belief.id)) wm.entities[e].beliefs.push(belief.id);
    });
    for(let i=0;i<ents.length;i++){
      for(let j=i+1;j<ents.length;j++){
        wm.relations.push({id:id("rel"),a:ents[i],b:ents[j],belief:belief.id,weight:.5,created_at:now()});
      }
    }
    wm.relations=wm.relations.slice(-1200);
    wm.updated_at=now();
    save(WORLD,wm);
    return wm;
  }

  function council(text){
    const a=initAgents();
    const transcript={};
    AGENT_NAMES.forEach(n=>{
      const line={
        Architect:`Structure: the claim must expose premises, dependencies, and failure boundaries.`,
        Scientist:`Evidence: the claim needs observable support and falsification criteria.`,
        Skeptic:`Attack: the weakest point is ambiguity, missing source, or overreach.`,
        Historian:`Precedent: similar ideas survive when they preserve audit trails.`,
        Auditor:`Integrity: provenance and contradiction records must remain attached.`,
        Strategist:`Usefulness: the claim matters only if it changes a decision or action.`,
        Dreamer:`Possibility: the claim may seed a larger model if allowed to branch.`,
        Cartographer:`Graph: connect this to nearby entities and competing beliefs.`,
        Synthesizer:`Integration: merge support, dissent, and utility into a working theory.`,
        Judge:`Verdict: accept provisionally, preserve dissent, continue scoring.`
      }[n];
      transcript[n]=line;
      a[n].cycles++;
      a[n].memory.unshift({at:now(),text:text.slice(0,150),line});
      a[n].memory=a[n].memory.slice(0,25);
      a[n].trust=Math.max(.35,Math.min(.98,+(a[n].trust+(Math.random()-.45)*.012).toFixed(3)));
    });
    save(AGENTS,a);
    return transcript;
  }

  function createBelief(text,origin="platform",parents=[]){
    if(origin==="human" && !validClaim(text)) return null;
    const list=beliefs();
    const related=list.map(b=>({id:b.id,score:relation(text,b.text)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.id);
    const pressure=/not|false|wrong|fail|risk|deny|contradict|unstable/i.test(text);
    const contradicts=list.filter(b=>related.includes(b.id)&&pressure!==/not|false|wrong|fail|risk|deny|contradict|unstable/i.test(b.text||"")).slice(0,6).map(b=>b.id);
    const evidence=artifacts().filter(a=>relation(text,a.text)>0).slice(0,8).map(a=>a.id);
    const transcript=council(text);
    const belief={
      id:id("belief"),
      text,origin,created_at:now(),derived_from:parents,
      related,supports:related.slice(0,4),contradicts,evidence,
      confidence:+(.56+Math.random()*.34-contradicts.length*.025+evidence.length*.015).toFixed(4),
      integrity:+(.68+Math.random()*.24+evidence.length*.02).toFixed(4),
      evidence_strength:+Math.min(1,evidence.length*.12).toFixed(4),
      council:transcript,
      status:contradicts.length?"contested":"active",
      verdict:contradicts.length?"Accepted under contradiction pressure.":"Accepted into working memory.",
      genome:{birth:now(),lineage:parents,mutations:0,offspring:[]}
    };
    list.unshift(belief);
    save(BELIEFS,list.slice(0,2000));
    updateWorldModel(belief);
    if(window.concordGenesis?.apply) window.concordGenesis.apply();
    return belief;
  }

  function makePrediction(){
    const l=beliefs();
    const source=l.length?pick(l):createBelief("Systems with memory and contradiction tracking should produce more stable knowledge over time.","seed",[]);
    const pred={
      id:id("prediction"),
      belief:source?.id||null,
      text:`If "${source?.text||"the system"}" is valid, future related beliefs should increase support and reduce unresolved contradiction pressure.`,
      created_at:now(),
      due:"future",
      status:"open",
      score:null
    };
    const list=predictions(); list.unshift(pred); save(PREDICTIONS,list.slice(0,500));
    createBelief(`Prediction registered: ${pred.text}`,"prediction",[source?.id].filter(Boolean));
    return pred;
  }

  function evolve(){
    const actions=[
      ()=>createBelief("A knowledge system becomes more reliable when evidence, contradiction, and lineage are stored as first-class objects.","evolution",[]),
      ()=>createBelief("Agent reputation should be earned from prediction accuracy, evidence quality, and contradiction handling.","evolution",[]),
      ()=>createBelief("A world model improves when entities and causal relationships are extracted from every accepted belief.","evolution",[]),
      ()=>createBelief("Dream hypotheses become useful when the Skeptic and Scientist are forced to attack them.","evolution",[]),
      makePrediction
    ];
    return pick(actions)();
  }

  function buildArchitectureSnapshot(){
    return {
      version:VERSION,
      updated_at:now(),
      layers:[
        "UI Globe",
        "Council Chamber",
        "Agent Runtime",
        "Belief Ledger",
        "Genesis Growth Scoring",
        "UPFIS Evidence Vault",
        "World Model",
        "Prediction Engine",
        "Autonomous Evolution Loop"
      ],
      counts:{
        beliefs:beliefs().length,
        artifacts:artifacts().length,
        entities:Object.keys(world().entities||{}).length,
        relations:(world().relations||[]).length,
        predictions:predictions().length,
        agents:Object.keys(initAgents()).length
      }
    };
  }

  function render(){
    const p=ensurePanel();
    const snap=buildArchitectureSnapshot();
    const wm=world();
    const ag=initAgents();
    const topEntities=Object.values(wm.entities||{}).sort((a,b)=>b.count-a.count).slice(0,10);
    const topBeliefs=beliefs().slice().sort((a,b)=>((b.genesis_score||0)+(b.evidence_strength||0))-((a.genesis_score||0)+(a.evidence_strength||0))).slice(0,8);
    p.innerHTML=`
      <div class="omniGrid">
        <button onclick="omniCoreV11.evolve()">EVOLVE</button>
        <button onclick="omniCoreV11.predict()">PREDICT</button>
        <button onclick="omniCoreV11.auto()">AUTO</button>
        <button onclick="omniCoreV11.stop()">STOP</button>
        <button onclick="omniCoreV11.rebuild()">REBUILD</button>
        <button onclick="omniCoreV11.snapshot()">SNAPSHOT</button>
      </div>

      <div class="omniTitle">OMNIAUTHOR PLATFORM CORE</div>
      <div class="omniCard">
        <span class="omniGood">beliefs ${snap.counts.beliefs}</span>
        · artifacts ${snap.counts.artifacts}
        · entities ${snap.counts.entities}
        · relations ${snap.counts.relations}
        · predictions ${snap.counts.predictions}
        · auto ${localStorage.getItem(RUN)==="1"?"on":"off"}
      </div>

      <div class="omniTitle">AGENT RUNTIME</div>
      ${Object.values(ag).map(a=>`<div class="omniCard"><span class="omniGold">${esc(a.name)}</span> · trust ${a.trust} · cycles ${a.cycles} · ${esc(a.specialty)}</div>`).join("")}

      <div class="omniTitle">WORLD MODEL · TOP ENTITIES</div>
      ${topEntities.map(e=>`<div class="omniCard"><span class="omniGood">${esc(e.id)}</span> · count ${e.count} · beliefs ${e.beliefs.length}</div>`).join("")||`<div class="omniCard omniDim">No entities yet.</div>`}

      <div class="omniTitle">HIGHEST VALUE BELIEFS</div>
      ${topBeliefs.map(b=>`<div class="omniCard">
        <div class="omniGold">${esc(b.id)} · ${esc(b.status)} · genesis ${b.genesis_score||"pending"} · evidence ${b.evidence_strength||0}</div>
        <div>${esc(b.text)}</div>
      </div>`).join("")}

      <div class="omniTitle">PREDICTIONS</div>
      ${predictions().slice(0,8).map(pr=>`<div class="omniCard"><span class="omniGood">${esc(pr.id)}</span> · ${esc(pr.status)}<br>${esc(pr.text)}</div>`).join("")||`<div class="omniCard omniDim">No predictions yet.</div>`}
    `;
  }

  function ensurePanel(){
    let p=document.getElementById("omniCorePanelV11");
    if(!p){p=document.createElement("div");p.id="omniCorePanelV11";document.body.appendChild(p)}
    return p;
  }

  function button(){
    if(document.getElementById("omniCoreBtnV11"))return;
    const b=document.createElement("button");
    b.id="omniCoreBtnV11"; b.textContent="CORE";
    b.onclick=()=>{render();const p=ensurePanel();p.style.display=p.style.display==="block"?"none":"block"};
    document.body.appendChild(b);
  }

  function rebuild(){
    const l=beliefs();
    l.forEach(updateWorldModel);
    if(window.upfisV10?.link) window.upfisV10.link();
    if(window.concordGenesis?.apply) window.concordGenesis.apply();
    render();
    return buildArchitectureSnapshot();
  }

  window.omniCoreV11={
    version:VERSION,
    create:createBelief,
    evolve(){const r=evolve();render();return r},
    predict(){const r=makePrediction();render();return r},
    auto(){localStorage.setItem(RUN,"1");createBelief("Platform autonomous evolution is enabled across council, evidence, Genesis, world model, and prediction layers.","system",[]);render()},
    stop(){localStorage.setItem(RUN,"0");createBelief("Platform autonomous evolution is paused by operator command.","system",[]);render()},
    rebuild,
    snapshot(){const s=buildArchitectureSnapshot();console.table(s.counts);return s},
    agents:initAgents,
    world,
    predictions,
    beliefs
  };

  button(); initAgents(); rebuild();
  setInterval(button,1000);
  setInterval(()=>{if(localStorage.getItem(RUN)==="1"){evolve();render();}},75000);
  console.log("OMNIAUTHOR_PLATFORM_CORE_V11 ready");
})();
</script>


<script id="OMNIAUTHOR_MATH_GOVERNANCE_CORE_V12">
(() => {
  const BELIEFS="omniauthor-belief-ledger-v1";
  const GOV="omniauthor-math-governance-v12";
  const AGENTS="omniauthor-agent-runtime-v11";

  const ACTIONS={
    PROMOTE:"PROMOTE",
    WATCH:"WATCH",
    CHALLENGE:"CHALLENGE",
    QUARANTINE:"QUARANTINE",
    MERGE:"MERGE",
    MUTATE:"MUTATE",
    ARCHIVE:"ARCHIVE"
  };

  const P={
    decayLambda:0.131,
    reinforcementRate:0.18,
    contradictionWeight:0.27,
    lineageWeight:0.22,
    evidenceWeight:0.31,
    symbolicWeight:0.08,
    noveltyWeight:0.07,
    promote:1.18,
    challenge:0.86,
    quarantine:0.62,
    archive:0.46
  };

  function load(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
  function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
  function now(){return new Date().toISOString()}
  function id(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
  function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
  function ageDays(iso){const t=iso?new Date(iso).getTime():Date.now();return Number.isFinite(t)?Math.max(0,(Date.now()-t)/86400000):0}
  function words(t){return String(t||"").toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3)}

  function atbash(s){
    return String(s||"").toLowerCase().replace(/[a-z]/g,c=>String.fromCharCode(122-(c.charCodeAt(0)-97)));
  }

  function gematriaLite(s){
    return String(s||"").toLowerCase().replace(/[^a-z]/g,"").split("")
      .reduce((n,c)=>n+(c.charCodeAt(0)-96),0);
  }

  function symbolicScore(a,b){
    const ga=gematriaLite(a), gb=gematriaLite(b);
    const diff=Math.abs(ga-gb);
    const gem=diff===0?1:diff<7?.6:diff<22?.3:0;
    const inv=words(atbash(a)).filter(w=>String(b||"").toLowerCase().includes(w)).length;
    return clamp(gem+(inv*.2),0,1);
  }

  function lineagePenalty(b,list){
    const parents=b.derived_from||[];
    if(!parents.length)return 0;
    const unique=new Set(parents).size;
    return parents.length?1-(unique/parents.length):0;
  }

  function scoreBelief(b,list){
    const decay=Math.exp(-P.decayLambda*ageDays(b.created_at));
    const evidence=(b.evidence||[]).length*P.evidenceWeight;
    const lineage=((b.supports||[]).length+(b.related||[]).length)*P.lineageWeight;
    const contradiction=(b.contradicts||[]).length*P.contradictionWeight;
    const novelty=clamp(words(b.text).length/18,0,1)*P.noveltyWeight;
    const reinforcement=(b.confidence||.5)*P.reinforcementRate;
    const duplicatePenalty=lineagePenalty(b,list)*.25;

    let symbolic=0;
    list.slice(0,40).forEach(x=>{
      if(x.id!==b.id) symbolic=Math.max(symbolic,symbolicScore(b.text,x.text));
    });
    symbolic*=P.symbolicWeight;

    const raw=decay+evidence+lineage+novelty+reinforcement+symbolic-contradiction-duplicatePenalty;

    return {
      total:+clamp(raw,0,1.618).toFixed(4),
      decay:+decay.toFixed(4),
      evidence:+evidence.toFixed(4),
      lineage:+lineage.toFixed(4),
      contradiction:+contradiction.toFixed(4),
      novelty:+novelty.toFixed(4),
      reinforcement:+reinforcement.toFixed(4),
      symbolic:+symbolic.toFixed(4),
      duplicate_penalty:+duplicatePenalty.toFixed(4)
    };
  }

  function decide(b,score){
    if((b.contradicts||[]).length>=4 && score.total<P.challenge)return ACTIONS.QUARANTINE;
    if(score.total>=P.promote)return ACTIONS.PROMOTE;
    if(score.total<P.archive)return ACTIONS.ARCHIVE;
    if(score.total<P.quarantine)return ACTIONS.QUARANTINE;
    if(score.total<P.challenge)return ACTIONS.CHALLENGE;
    if((b.related||[]).length>=6)return ACTIONS.MERGE;
    if(score.novelty>.055 && score.symbolic>.03)return ACTIONS.MUTATE;
    return ACTIONS.WATCH;
  }

  function applyAction(b,action,score){
    b.math_governance={
      version:"v12",
      last_reviewed:now(),
      score,
      action,
      parameters:P
    };

    b.status={
      PROMOTE:"promoted",
      WATCH:"watch",
      CHALLENGE:"challenged",
      QUARANTINE:"quarantined",
      MERGE:"merge-candidate",
      MUTATE:"mutation-candidate",
      ARCHIVE:"archived"
    }[action]||b.status;

    b.governance_rationale=[
      `total=${score.total}`,
      `evidence=${score.evidence}`,
      `lineage=${score.lineage}`,
      `contradiction=${score.contradiction}`,
      `symbolic=${score.symbolic}`,
      `action=${action}`
    ].join(" · ");

    return b;
  }

  function review(){
    const list=load(BELIEFS,[]);
    const report=[];
    list.forEach(b=>{
      const score=scoreBelief(b,list);
      const action=decide(b,score);
      applyAction(b,action,score);
      report.push({id:b.id,text:b.text,score:score.total,action,status:b.status});
    });
    save(BELIEFS,list);
    save(GOV,{version:"v12",updated_at:now(),report});
    if(window.concordGenesis?.apply) window.concordGenesis.apply();
    render(report);
    return report;
  }

  function render(report){
    let panel=document.getElementById("mathGovPanelV12");
    if(!panel){
      panel=document.createElement("div");
      panel.id="mathGovPanelV12";
      panel.style.cssText="position:fixed;left:10px;right:10px;bottom:82px;z-index:999999;max-height:62vh;overflow:auto;display:none;background:rgba(2,4,14,.97);color:#e8e4d9;border:1px solid rgba(255,217,143,.48);border-radius:18px;padding:14px;font-family:monospace;font-size:11px;box-shadow:0 0 55px rgba(255,217,143,.14);backdrop-filter:blur(14px)";
      document.body.appendChild(panel);
    }

    const r=report||load(GOV,{report:[]}).report||[];
    const counts=r.reduce((m,x)=>{m[x.action]=(m[x.action]||0)+1;return m},{});

    panel.innerHTML=`
      <div style="color:#ffd98f;letter-spacing:.22em;margin-bottom:8px">MATH GOVERNANCE CORE</div>
      <div style="border-bottom:1px solid rgba(255,255,255,.08);padding:8px 0">
        PROMOTE ${counts.PROMOTE||0} · WATCH ${counts.WATCH||0} · CHALLENGE ${counts.CHALLENGE||0} · QUARANTINE ${counts.QUARANTINE||0} · ARCHIVE ${counts.ARCHIVE||0}
      </div>
      ${r.slice(0,18).map(x=>`
        <div style="border-bottom:1px solid rgba(255,255,255,.08);padding:8px 0">
          <div style="color:${x.action==="PROMOTE"?"#00e5cc":x.action==="QUARANTINE"||x.action==="ARCHIVE"?"#ff6b35":"#ffd98f"}">${x.action} · score ${x.score} · ${x.id}</div>
          <div>${String(x.text||"").replace(/[<>&]/g,"")}</div>
        </div>
      `).join("")}
    `;
  }

  function button(){
    if(document.getElementById("mathGovBtnV12"))return;
    const b=document.createElement("button");
    b.id="mathGovBtnV12";
    b.textContent="MATH GOV";
    b.style.cssText="position:fixed;right:16px;top:294px;z-index:999999;background:rgba(18,10,34,.92);color:#ffd98f;border:1px solid rgba(255,217,143,.5);border-radius:12px;padding:10px 12px;font-family:monospace;font-size:9px;letter-spacing:.14em;backdrop-filter:blur(12px)";
    b.onclick=()=>{const r=review();const p=document.getElementById('mathGovPanelV12');p.style.display=p.style.display==='block'?'none':'block'};
    document.body.appendChild(b);
  }

  window.omniMathGovV12={
    version:"v12",
    review,
    score:scoreBelief,
    atbash,
    gematria:gematriaLite,
    symbolicScore,
    parameters:P,
    report(){return load(GOV,{report:[]})}
  };

  button();
  setInterval(button,1000);
  setInterval(review,120000);
  review();
  console.log("OMNIAUTHOR_MATH_GOVERNANCE_CORE_V12 ready");
})();
</script>

<script id="OMNIAUTHOR_MULTIMODAL_INTERFACE_V13">
(() => {
  const VERSION="v13";
  const CHAT="omniauthor-conversation-v13";
  const TASKS="omniauthor-tasks-v13";
  const MEDIA="omniauthor-media-artifacts-v13";
  const EXPORTS="omniauthor-generated-artifacts-v13";

  function load(k,d=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
  function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
  function id(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
  function now(){return new Date().toISOString()}
  function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

  function addChat(role,text,meta={}){
    const list=load(CHAT,[]);
    const msg={id:id("msg"),role,text,meta,created_at:now()};
    list.unshift(msg);
    save(CHAT,list.slice(0,500));
    return msg;
  }

  function classifyTask(text){
    const s=String(text||"").trim();
    if(/^task:/i.test(s)||/\b(remind|todo|fix|build|create|write|review|deploy|test|push)\b/i.test(s)){
      return "task";
    }
    if(/\b(is|are|becomes|causes|supports|contradicts|requires|means|should|will|can|must)\b/i.test(s)){
      return "belief";
    }
    return "conversation";
  }

  function performLogic(text){
    const kind=classifyTask(text);
    addChat("user",text,{kind});

    if(kind==="task"){
      const tasks=load(TASKS,[]);
      const task={id:id("task"),text:text.replace(/^task:\s*/i,""),status:"open",created_at:now(),steps:[
        "Clarify objective",
        "Identify required inputs",
        "Execute smallest next action",
        "Verify result",
        "Record artifact"
      ]};
      tasks.unshift(task); save(TASKS,tasks.slice(0,300));
      addChat("system",`Task created: ${task.text}`,{task_id:task.id});
      speak(`Task created.`);
      return task;
    }

    if(kind==="belief"){
      if(window.omniMathGovV12?.review) window.omniMathGovV12.review();
      if(window.omniCoreV11?.create) window.omniCoreV11.create(text,"conversation",[]);
      else if(window.concordV8?.make) window.concordV8.make(text,"conversation",[]);
      addChat("system","Belief routed through council, ledger, Genesis, UPFIS, and math governance layers.",{kind});
      speak("Belief routed through governance.");
      return {kind:"belief"};
    }

    addChat("system","Conversation recorded. Add 'task:' to create a task, or make a full claim to enter the belief ledger.",{kind});
    speak("Conversation recorded.");
    return {kind:"conversation"};
  }

  async function handleFiles(files){
    const existing=load(MEDIA,[]);
    for(const f of files){
      const data=await readFile(f);
      existing.unshift({
        id:id("media"),
        name:f.name,
        type:f.type||"unknown",
        size:f.size,
        created_at:now(),
        data,
        artifact_type:f.type.startsWith("image/")?"image":f.type.startsWith("video/")?"video":f.type.startsWith("audio/")?"audio":"file",
        notes:"Local browser artifact. For real server-side analysis, connect backend."
      });
      if(window.upfisV10?.addArtifact) window.upfisV10.addArtifact(`Media artifact uploaded: ${f.name} (${f.type||"unknown"})`,"multimodal-interface","media");
    }
    save(MEDIA,existing.slice(0,80));
    render();
  }

  function readFile(file){
    return new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(r.result);
      r.onerror=rej;
      r.readAsDataURL(file);
    });
  }

  function speak(text){
    try{
      if(!("speechSynthesis" in window))return;
      const u=new SpeechSynthesisUtterance(String(text).slice(0,220));
      u.rate=.95;u.pitch=.85;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch{}
  }

  function listen(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Speech recognition not supported on this browser.");return}
    const rec=new SR();
    rec.lang="en-US";rec.interimResults=false;
    rec.onresult=e=>{
      const text=e.results[0][0].transcript;
      const input=document.getElementById("miChatInput");
      if(input)input.value=text;
      performLogic(text);
      render();
    };
    rec.start();
  }

  function exportJSON(){
    const payload={
      version:VERSION,
      exported_at:now(),
      conversation:load(CHAT,[]),
      tasks:load(TASKS,[]),
      media:load(MEDIA,[]).map(x=>({...x,data:x.data?.slice(0,80)+"..."})),
      beliefs:JSON.parse(localStorage.getItem("omniauthor-belief-ledger-v1")||"[]"),
      math_governance:window.omniMathGovV12?.report?.()||null,
      platform:window.omniCoreV11?.snapshot?.()||null
    };
    download("omniauthor_artifact_"+Date.now()+".json",JSON.stringify(payload,null,2),"application/json");
    const ex=load(EXPORTS,[]);
    ex.unshift({id:id("export"),type:"json",created_at:now(),name:"OmniAuthor full artifact export"});
    save(EXPORTS,ex.slice(0,100));
  }

  function exportReport(){
    const chats=load(CHAT,[]).slice(0,30);
    const tasks=load(TASKS,[]).slice(0,30);
    const beliefs=JSON.parse(localStorage.getItem("omniauthor-belief-ledger-v1")||"[]").slice(0,30);
    const html=`<!doctype html><html><head><meta charset="utf-8"><title>OmniAuthor Report</title>
    <style>body{background:#060814;color:#e8e4d9;font-family:monospace;padding:24px}h1,h2{color:#00e5cc}.card{border-bottom:1px solid #333;padding:10px 0}</style>
    </head><body><h1>OmniAuthor Artifact Report</h1><p>${now()}</p>
    <h2>Conversation</h2>${chats.map(x=>`<div class="card"><b>${esc(x.role)}</b>: ${esc(x.text)}</div>`).join("")}
    <h2>Tasks</h2>${tasks.map(x=>`<div class="card"><b>${esc(x.status)}</b>: ${esc(x.text)}</div>`).join("")}
    <h2>Beliefs</h2>${beliefs.map(x=>`<div class="card"><b>${esc(x.id)}</b>: ${esc(x.text)}<br>${esc(x.verdict||"")}</div>`).join("")}
    </body></html>`;
    download("omniauthor_report_"+Date.now()+".html",html,"text/html");
  }

  function download(name,content,type){
    const blob=new Blob([content],{type});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function completeTask(idv){
    const tasks=load(TASKS,[]);
    const t=tasks.find(x=>x.id===idv);
    if(t){t.status=t.status==="done"?"open":"done";save(TASKS,tasks);render()}
  }

  function render(){
    const panel=ensurePanel();
    const chat=load(CHAT,[]);
    const tasks=load(TASKS,[]);
    const media=load(MEDIA,[]);
    panel.innerHTML=`
      <div class="miGrid">
        <label>UPLOAD<input id="miFileInput" type="file" multiple accept="image/*,video/*,audio/*,.txt,.json,.md,.html,.pdf" style="display:none"></label>
        <button onclick="omniInterfaceV13.listen()">VOICE IN</button>
        <button onclick="omniInterfaceV13.exportJSON()">EXPORT JSON</button>
        <button onclick="omniInterfaceV13.exportReport()">REPORT</button>
      </div>

      <div class="miTitle">CONVERSATION + TASK LOGIC</div>
      <textarea id="miChatInput" placeholder="Talk to OmniAuthor. Use 'task:' for tasks, or make a full claim for the belief engine."></textarea>
      <div class="miGrid">
        <button onclick="omniInterfaceV13.send()">SEND</button>
        <button onclick="omniInterfaceV13.clearChat()">CLEAR CHAT</button>
      </div>

      <div class="miTitle">RECENT CONVERSATION</div>
      ${chat.slice(0,12).map(x=>`<div class="miCard"><span class="miGold">${esc(x.role)}</span> · ${esc(x.meta?.kind||"")}: ${esc(x.text)}</div>`).join("")||`<div class="miCard miDim">No conversation yet.</div>`}

      <div class="miTitle">TASKS</div>
      ${tasks.slice(0,14).map(t=>`<div class="miCard" onclick="omniInterfaceV13.complete('${t.id}')"><span class="${t.status==="done"?"miDim":"miGold"}">${esc(t.status)}</span> · ${esc(t.text)}<br><span class="miDim">${t.steps.join(" → ")}</span></div>`).join("")||`<div class="miCard miDim">No tasks yet.</div>`}

      <div class="miTitle">MEDIA ARTIFACTS</div>
      ${media.slice(0,10).map(m=>`<div class="miCard miPreview"><span class="miGold">${esc(m.artifact_type)}</span> · ${esc(m.name)} · ${Math.round((m.size||0)/1024)}kb
        ${m.artifact_type==="image"?`<img src="${m.data}">`:""}
        ${m.artifact_type==="video"?`<video src="${m.data}" controls></video>`:""}
        ${m.artifact_type==="audio"?`<audio src="${m.data}" controls></audio>`:""}
      </div>`).join("")||`<div class="miCard miDim">No media uploaded.</div>`}
    `;
    const input=document.getElementById("miFileInput");
    if(input&&!input.dataset.bound){input.dataset.bound="1";input.onchange=e=>handleFiles([...e.target.files])}
  }

  function ensurePanel(){
    let p=document.getElementById("omniInterfacePanelV13");
    if(!p){p=document.createElement("div");p.id="omniInterfacePanelV13";document.body.appendChild(p)}
    return p;
  }

  function button(){
    if(document.getElementById("omniInterfaceBtnV13"))return;
    const b=document.createElement("button");
    b.id="omniInterfaceBtnV13";
    b.textContent="INTERFACE";
    b.onclick=()=>{render();const p=ensurePanel();p.style.display=p.style.display==="block"?"none":"block"};
    document.body.appendChild(b);
  }

  window.omniInterfaceV13={
    version:VERSION,
    send(){
      const i=document.getElementById("miChatInput");
      const text=(i?.value||"").trim();
      if(!text)return;
      i.value="";
      performLogic(text);
      render();
    },
    listen,
    speak,
    exportJSON,
    exportReport,
    complete:completeTask,
    clearChat(){save(CHAT,[]);render()},
    media:()=>load(MEDIA,[]),
    tasks:()=>load(TASKS,[]),
    chat:()=>load(CHAT,[])
  };

  button();
  setInterval(button,1000);
  console.log("OMNIAUTHOR_MULTIMODAL_INTERFACE_V13 ready");
})();
</script>
