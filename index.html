<script>
/* ═══════════════════════════════════════════════════════════════════════════
   OMNIAUTHOR — FINAL PROTOTYPE ENGINE + RENDER
   Fixes implemented:
   1. Real council reasoning via Anthropic API (keyless in artifacts,
      key-prompt fallback for Termux/browser), local engine as offline fallback
   2. Live contradiction detection → storms form between YOUR beliefs
   3. Evidence lineage — every verdict carries sources + full ancestry
   4. Weather while away — beliefs drift, storms shift between sessions
   5. First-run experience — dark planet, your first belief; exemplars optional
   ═══════════════════════════════════════════════════════════════════════════ */

"use strict";

const PAL = {
  void:"#030309", gold:"#e8b96a", goldHot:"#ffd98f",
  white:"#f0f2fa", soft:"#aab6d4", dim:"#5e6a8e", faint:"#2c3450",
  land:"#ff7a3c", land2:"#e85530", land3:"#ffae5c",
  cyan:"#41d8ff", pink:"#ff4fa0", purple:"#a86dff",
  green:"#52e890", red:"#ff4838", amber:"#ffb340", teal:"#4fffd4",
};
const CHIPCOLORS = [PAL.cyan, PAL.pink, PAL.purple, PAL.green, PAL.amber, PAL.teal];
const D2R = Math.PI / 180;

/* ── WORLD ── */
const WORLD = [
"                                                ",
"                  ##          ######            ",
"   #####  ####   ###      ## ###########        ",
"  ########### #  ###     ##############         ",
"  ############    #      ##############         ",
"   ###########          ################        ",
"    #########          #################        ",
"     ########         ####  ###########         ",
"      ######          ##### ## ### ####         ",
"       ####           ######  #### ## ##        ",
"        ## ##         ######   ##   # ##        ",
"          ####         #####        ####        ",
"          #####        #####         ###        ",
"          #####        ####          # ##       ",
"          ####          ###            ####     ",
"          ####          ###           ######    ",
"           ##           ##            ######    ",
"           ##            #             ###      ",
"           #                                    ",
"           #                                    ",
"                                                ",
"                                                ",
"                                                ",
"                                                ",
];
const LAND_DOTS = [], OCEAN_DOTS = [];
(function(){
  let seed = 5;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  for (let r = 0; r < 24; r++) for (let c = 0; c < 48; c++) {
    const lat0 = 90 - (r / 24) * 180, lon0 = (c / 48) * 360 - 180;
    if (WORLD[r][c] === "#") {
      for (let sy = 0; sy < 2; sy++) for (let sx = 0; sx < 2; sx++) {
        const rv = rnd();
        LAND_DOTS.push({
          lat: lat0 - (sy + 0.5) * 3.75, lon: lon0 + (sx + 0.5) * 3.75,
          j: rnd() * Math.PI * 2,
          c: rv > 0.93 ? CHIPCOLORS[Math.floor(rnd()*6)] :
             rv > 0.55 ? PAL.land : rv > 0.25 ? PAL.land3 : PAL.land2,
        });
      }
    } else if ((r + c) % 2 === 0 && r > 1 && r < 21) {
      OCEAN_DOTS.push({ lat: lat0 - 3.75, lon: lon0 + 3.75 });
    }
  }
})();

/* ── REGIONS ── */
const REGIONS = {
  na: { name: "North America · Technology", lat: 42,  lon: -100 },
  eu: { name: "Europe · Philosophy",        lat: 50,  lon: 15 },
  as: { name: "Asia · Systems",             lat: 35,  lon: 95 },
  af: { name: "Africa · Discovery",         lat: 5,   lon: 22 },
  sa: { name: "South America · Narrative",  lat: -18, lon: -60 },
  oc: { name: "Oceania · Frontier",         lat: -27, lon: 140 },
};
const REGION_KW = {
  na: ["code","system","software","sync","ledger","hash","data","tech","engine","ai","model","compute","network","robot"],
  eu: ["truth","belief","ethic","mean","mind","conscious","know","epistem","moral","god","faith","free","real","justice"],
  as: ["market","econom","supply","scale","manufactur","trade","price","industr","growth","money"],
  af: ["pattern","number","prime","structure","origin","ancient","discover","gematria","cipher","math"],
  sa: ["story","book","write","character","narrat","fiction","art","music","creat","film"],
  oc: ["future","unknown","frontier","possible","will","2030","2040","2050","emerge","quantum","space","fusion"],
};
function placeByKeyword(text) {
  const t = text.toLowerCase();
  let best = "oc", bs = 0;
  for (const k of Object.keys(REGION_KW)) {
    const s = REGION_KW[k].reduce((a, w) => a + (t.includes(w) ? 1 : 0), 0);
    if (s > bs) { bs = s; best = k; }
  }
  return best;
}

/* ── EXEMPLAR BELIEFS (optional) ── */
function mkSeed(id, lat, lon, color, label, region, detail, conf, born) {
  return { id, lat, lon, color, label, region, detail, conf, born, seed: true,
    evidence: [], contradicts: [], revisions: [] };
}
const SEEDS = [
  mkSeed("x_na1", 42, -100, PAL.cyan,  "Belief ledger sovereignty", "North America · Technology",
    "All state routes through the append-only ledger. Locked invariant.", 0.97, 2025.4),
  mkSeed("x_na2", 50, -118, PAL.purple,"Distributed sync convergence", "North America · Technology",
    "Tie-break: evidence → trust → recency → claim_id.", 0.78, 2026.0),
  mkSeed("x_eu1", 48, 10,   PAL.amber, "Can dissent survive merging?", "Europe · Philosophy",
    "The Rationale Persistence Clause demands minority survival.", 0.55, 2026.2),
  mkSeed("x_as1", 35, 105,  PAL.cyan,  "Bayesian forensic engine", "Asia · Systems",
    "Multi-stream Welford statistics, adaptive thresholds.", 0.93, 2025.2),
  mkSeed("x_af1", 10, 20,   PAL.amber, "2701 = 37 × 73 = T(73)", "Africa · Discovery",
    "Triangular-hexagonal structure verified. Meaning contested.", 0.99, 2024.3),
  mkSeed("x_sa1", -15, -60, PAL.green, "Lean prose discipline", "South America · Narrative",
    "V1 lean beat V2 expanded. Restraint is the voice.", 0.90, 2025.0),
  mkSeed("x_oc1", -25, 135, PAL.teal,  "Shared belief space", "Oceania · Frontier",
    "Independent models converge on isomorphic structures.", 0.30, 2026.4),
];

/* ── COUNCIL ── */
const COUNCIL = [
  { id:"architect",  name:"Architect",  color:"#41d8ff", glyph:"⬡", incl: 0.25, speed: 0.21, phase: 0.0, trust: 0.88 },
  { id:"skeptic",    name:"Skeptic",    color:"#ff4838", glyph:"⊘", incl:-0.45, speed: 0.16, phase: 1.1, trust: 0.82 },
  { id:"scientist",  name:"Scientist",  color:"#52e890", glyph:"◬", incl: 0.55, speed: 0.26, phase: 2.2, trust: 0.90 },
  { id:"historian",  name:"Historian",  color:"#e8b96a", glyph:"◷", incl:-0.15, speed: 0.12, phase: 3.1, trust: 0.85 },
  { id:"auditor",    name:"Auditor",    color:"#a86dff", glyph:"▣", incl: 0.7,  speed: 0.19, phase: 4.2, trust: 0.87 },
  { id:"strategist", name:"Strategist", color:"#4fffd4", glyph:"✦", incl:-0.6,  speed: 0.29, phase: 5.3, trust: 0.84 },
];
const COUNCIL_BY_ID = Object.fromEntries(COUNCIL.map(m => [m.id, m]));

function hash16(s) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) {
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return ((h2 >>> 0).toString(16).padStart(8,"0") + (h1 >>> 0).toString(16).padStart(8,"0")).slice(0, 16);
}

/* ── INTEGRITY (locked formula) ── */
function scoreAndResolve(members) {
  members.forEach(c => {
    const peers = members.filter(o => o !== c);
    c.peerAgreement = peers.reduce((s, o) => s + (o.stance === c.stance ? 0.5 : -0.3), 0) / peers.length;
    const trust = COUNCIL_BY_ID[c.id].trust;
    c.integrity = c.evidence * trust * 0.80 + c.confidence * trust * 0.15 +
      ((c.peerAgreement + 1) / 2) * 0.05;
  });
  const sorted = [...members].sort((a, b) =>
    b.integrity - a.integrity || b.evidence - a.evidence ||
    COUNCIL_BY_ID[b.id].trust - COUNCIL_BY_ID[a.id].trust ||
    (a.id < b.id ? -1 : 1));
  const winner = sorted[0];
  const dissent = members.filter(c => c.stance !== winner.stance);
  const consensusPct = Math.round(
    members.reduce((s, c) => s + (c.stance === winner.stance ? c.integrity : 0), 0) /
    members.reduce((s, c) => s + c.integrity, 0) * 100);
  return { winner, dissent, consensusPct };
}

/* ── FALLBACK LOCAL ENGINE (offline) ── */
function localDeliberate(proposition, existing) {
  const pHash = hash16(proposition);
  const members = COUNCIL.map((m, i) => {
    const b = parseInt(pHash.slice(i*2, i*2+2), 16) / 255;
    return {
      id: m.id, stance: b > 0.5 ? "affirms" : "doubts",
      evidence: Math.min(0.95, Math.max(0.4, 0.5 + b * 0.4)),
      confidence: Math.min(0.95, Math.max(0.35, 0.45 + (1-b) * 0.4)),
      argument: b > 0.5
        ? `${m.name} finds the premise structurally sound`
        : `${m.name} finds the evidence base insufficient`,
    };
  });
  // naive contradiction: shared 4+ letter words + negation asymmetry
  const negs = ["not","never","no ","false","won't","wont","isn't","isnt","can't","cant"];
  const tw = proposition.toLowerCase();
  const hasNeg = negs.some(n => tw.includes(n));
  const words = tw.split(/\W+/).filter(w => w.length > 4);
  const contradicts = [];
  existing.forEach((b2, idx) => {
    const t2 = (b2.label + " " + (b2.proposition || "")).toLowerCase();
    const shared = words.filter(w => t2.includes(w)).length;
    const negs2 = negs.some(n => t2.includes(n));
    if (shared >= 2 && hasNeg !== negs2) contradicts.push(idx);
  });
  return {
    members,
    verdictText: null, // composed after scoring
    regionKey: placeByKeyword(proposition),
    evidenceLines: ["Local engine — offline mode. Connect for sourced reasoning."],
    contradicts,
    mode: "local",
  };
}

/* ── REAL COUNCIL — Anthropic API ── */
async function apiDeliberate(proposition, existing, apiKey) {
  const existingList = existing.map((b, i) => `${i}: ${b.label}`).join("\n") || "(none)";
  const prompt = `You are the OmniAuthor Council: six reasoning perspectives deliberating a proposition. Members: architect (systems/structure), skeptic (doubt/failure modes), scientist (empirical evidence), historian (precedent), auditor (consistency/rules), strategist (pragmatics).

PROPOSITION: "${proposition}"

EXISTING BELIEFS (index: label):
${existingList}

Genuinely reason about the proposition. Each member independently takes a stance with calibrated numbers. Respond ONLY with JSON, no markdown fences:
{"members":[{"id":"architect","stance":"affirms"|"doubts","evidence":0.0-1.0,"confidence":0.0-1.0,"argument":"their actual argument, under 18 words"}, ... all six ids],"verdict":"two-sentence synthesis of where the council landed and why","region":"na"|"eu"|"as"|"af"|"sa"|"oc" (na=technology, eu=philosophy/ethics, as=economics/systems, af=mathematics/discovery, sa=narrative/art, oc=future/frontier),"evidenceLines":["three short source-style evidence considerations, each under 15 words"],"contradicts":[indices of existing beliefs this proposition directly contradicts, empty if none]}`;

  const headers = { "Content-Type": "application/json" };
  if (apiKey) {
    headers["x-api-key"] = apiKey;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", headers,
    body: JSON.stringify({
      model: "claude-sonnet-4-6", max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!resp.ok) throw new Error("api " + resp.status);
  const data = await resp.json();
  const text = (data.content || []).filter(x => x.type === "text").map(x => x.text).join("\n");
  const clean = text.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(clean);
  const members = COUNCIL.map(m => {
    const got = (parsed.members || []).find(x => x.id === m.id) || {};
    return {
      id: m.id,
      stance: got.stance === "doubts" ? "doubts" : "affirms",
      evidence: Math.min(0.99, Math.max(0.05, +got.evidence || 0.5)),
      confidence: Math.min(0.99, Math.max(0.05, +got.confidence || 0.5)),
      argument: String(got.argument || `${m.name} weighs the premise`).slice(0, 140),
    };
  });
  return {
    members,
    verdictText: String(parsed.verdict || "").slice(0, 320),
    regionKey: REGIONS[parsed.region] ? parsed.region : placeByKeyword(proposition),
    evidenceLines: (parsed.evidenceLines || []).slice(0, 3).map(s => String(s).slice(0, 110)),
    contradicts: (parsed.contradicts || []).filter(i => Number.isInteger(i) && i >= 0 && i < existing.length),
    mode: "council",
  };
}

/* ── STORAGE ── */
const store = {
  async get(k) {
    try { if (window.storage) { const r = await window.storage.get(k); return r ? r.value : null; } } catch(e) {}
    try { return localStorage.getItem(k); } catch(e) { return null; }
  },
  async set(k, v) {
    try { if (window.storage) { await window.storage.set(k, v); return; } } catch(e) {}
    try { localStorage.setItem(k, v); } catch(e) {}
  },
};

/* ── STATE ── */
const S = {
  beliefs: [],          // user beliefs (persisted)
  seedsOn: false,
  apiKey: null,
  epoch: 2026.6,
  focus: null,
  deliberating: false,
  speakQueue: [],
  weatherNote: null,
  entered: false,
  flare: 0,
  stormFlash: 0,
};
function allBeliefs() { return S.seedsOn ? [...SEEDS, ...S.beliefs] : [...S.beliefs]; }
function allStormPairs() {
  const all = allBeliefs();
  const pairs = [];
  all.forEach((b, i) => (b.contradicts || []).forEach(targetId => {
    const j = all.findIndex(x => x.id === targetId);
    if (j >= 0) pairs.push([b.id, all[j].id, b.stormIntensity || 0.8]);
  }));
  if (S.seedsOn) pairs.push(["x_na2","x_eu1", 0.6]);
  return pairs;
}
function allGoldPairs() {
  if (!S.seedsOn) return [];
  return [["x_na1","x_as1"],["x_eu1","x_oc1"],["x_af1","x_sa1"]];
}

/* ── WEATHER WHILE AWAY (fix #4) ── */
function applyWeather(daysAway) {
  if (daysAway < 0.04 || !S.beliefs.length) return null;
  let drifted = 0, stormShift = 0;
  S.beliefs.forEach(b => {
    const h = parseInt(hash16(b.id).slice(0, 6), 16);
    const drift = Math.sin(h + daysAway * 1.7) * Math.min(0.06, 0.015 * daysAway);
    if (Math.abs(drift) > 0.004) {
      const old = b.conf;
      b.conf = Math.min(0.99, Math.max(0.05, b.conf + drift));
      b.revisions = b.revisions || [];
      b.revisions.push({ t: new Date().toISOString(), from: old, to: b.conf,
        why: drift > 0 ? "ambient corroboration" : "ambient erosion" });
      drifted++;
    }
    if (b.contradicts && b.contradicts.length) {
      b.stormIntensity = Math.min(1.2, (b.stormIntensity || 0.8) + Math.cos(h) * 0.15);
      stormShift++;
    }
  });
  if (!drifted && !stormShift) return null;
  const parts = [];
  if (drifted) parts.push(`${drifted} belief${drifted>1?"s":""} drifted`);
  if (stormShift) parts.push(`storm weather shifted`);
  return `While you were away: ${parts.join(" · ")}.`;
}

/* ── AMBIENCE ── */
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
const R1 = rng(7);
const CONFETTI = Array.from({ length: 170 }, () => ({
  x: R1(), y: R1(), spd: 0.0005 + R1() * 0.0015, size: 1.4 + R1() * 3.4,
  color: CHIPCOLORS[Math.floor(R1()*6)], blink: R1() * Math.PI * 2,
  depth: 0.3 + R1() * 0.7, rect: R1() > 0.4,
}));
const R2 = rng(31);
const BOKEH = Array.from({ length: 30 }, () => ({
  x: R2(), y: R2(), r: 14 + R2() * 50,
  color: R2() > 0.5 ? PAL.red : PAL.cyan, a: 0.03 + R2() * 0.05, drift: R2() * Math.PI * 2,
}));
const R3 = rng(57);
const BARS_L = Array.from({ length: 28 }, () => ({ h: 0.07 + R3() * 0.32, c: R3() > 0.45 ? PAL.red : PAL.cyan, ph: R3() * Math.PI * 2 }));
const BARS_R = Array.from({ length: 28 }, () => ({ h: 0.06 + R3() * 0.36, c: R3() > 0.55 ? PAL.cyan : PAL.red, ph: R3() * Math.PI * 2 }));
const R4 = rng(91);
const TOWERS = Array.from({ length: 130 }, () => {
  const a = R4() * Math.PI * 2, rr = Math.sqrt(R4());
  return { a, rr, h: 6 + R4() * 30, ph: R4() * Math.PI * 2,
    c: [PAL.red, "#ff7040", PAL.amber, "#ff5868", "#ff8a50"][Math.floor(R4()*5)] };
});

/* ── CAMERA / CANVAS ── */
const rot = { y: 0.4, x: -0.22, vy: 0.0014, zoom: 1, tzoom: 1, tyaw: null, tpitch: null };
let drag = null;
const dims = { w: 800, h: 600 };
let chipScreen = {};
let summonAmt = 0;
let T = 0;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  dims.w = window.innerWidth; dims.h = window.innerHeight;
  canvas.width = dims.w * dpr; canvas.height = dims.h * dpr;
  canvas.style.width = dims.w + "px"; canvas.style.height = dims.h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function sph(latDeg, lonDeg, ry, rx) {
  const lat = latDeg * D2R, lon = lonDeg * D2R + ry;
  const x = Math.cos(lat) * Math.sin(lon);
  const y = Math.sin(lat);
  const z = Math.cos(lat) * Math.cos(lon);
  return [x, y * Math.cos(rx) - z * Math.sin(rx), y * Math.sin(rx) + z * Math.cos(rx)];
}
function hexA(color, a) { return color + Math.round(Math.min(1, Math.max(0, a)) * 255).toString(16).padStart(2, "0"); }

function draw() {
  T += 0.016;
  const t = T, ep = S.epoch, w = dims.w, h = dims.h;

  const beat = Math.max(0, Math.sin((t % 9) / 9 * Math.PI * 2 - Math.PI / 2));
  S.flare = Math.max(0, S.flare - 0.012);
  S.stormFlash = Math.max(0, S.stormFlash - 0.008);
  const flare = Math.max(S.flare, Math.pow(Math.max(0, 1 - (t % 9) / 1.6), 2) * 0.35);

  if (!drag) {
    if (rot.tyaw !== null) {
      let dyaw = rot.tyaw - rot.y; dyaw = ((dyaw + Math.PI) % (2*Math.PI)) - Math.PI;
      rot.y += dyaw * 0.06;
      rot.x += (rot.tpitch - rot.x) * 0.06;
      if (Math.abs(dyaw) < 0.002) rot.tyaw = null;
    } else {
      rot.y += rot.vy * (S.focus || S.deliberating ? 0.12 : 1);
    }
  }
  rot.zoom += (rot.tzoom - rot.zoom) * 0.06;
  summonAmt += ((S.deliberating ? 1 : 0) - summonAmt) * 0.035;

  const R = Math.min(w, h) * 0.265 * rot.zoom;
  const CX = w / 2, CY = h / 2 - 26;

  ctx.fillStyle = PAL.void;
  ctx.fillRect(0, 0, w, h);

  // storm weather tints the sky when contradictions exist
  const stormCount = allStormPairs().length;
  if (stormCount > 0) {
    const sg = ctx.createRadialGradient(CX, CY * 0.4, 0, CX, CY * 0.4, w * 0.7);
    sg.addColorStop(0, hexA(PAL.red, 0.025 + S.stormFlash * 0.08 + Math.sin(t * 0.7) * 0.01));
    sg.addColorStop(1, "transparent");
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, w, h);
  }

  BOKEH.forEach(b => {
    const bx = (b.x + Math.sin(t * 0.05 + b.drift) * 0.01) * w;
    const by = (b.y + Math.cos(t * 0.04 + b.drift) * 0.01) * h;
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, b.r);
    g.addColorStop(0, hexA(b.color, b.a));
    g.addColorStop(1, "transparent");
    ctx.fillStyle = g;
    ctx.fillRect(bx - b.r, by - b.r, b.r * 2, b.r * 2);
  });

  const bw = w * 0.012;
  BARS_L.forEach((b, i) => {
    const bh = b.h * h * (0.85 + Math.sin(t * 0.7 + b.ph) * 0.15);
    ctx.fillStyle = hexA(b.c, 0.085);
    ctx.fillRect(w * 0.01 + i * bw * 1.35, h * 0.87 - bh, bw, bh);
  });
  BARS_R.forEach((b, i) => {
    const bh = b.h * h * (0.85 + Math.sin(t * 0.6 + b.ph) * 0.15);
    ctx.fillStyle = hexA(b.c, 0.075);
    ctx.fillRect(w * 0.99 - (28 - i) * bw * 1.35, h * 0.89 - bh, bw, bh);
  });

  ctx.strokeStyle = "rgba(65, 216, 255, 0.05)";
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 9; i++) {
    ctx.beginPath();
    ctx.moveTo(0, h * 0.12 + i * h * 0.1);
    ctx.lineTo(w, h * 0.09 + i * h * 0.1);
    ctx.stroke();
  }

  CONFETTI.forEach(p => {
    p.y += p.spd; if (p.y > 1.05) p.y = -0.05;
    const px = p.x * w, py = p.y * h;
    if (Math.hypot(px - CX, py - CY) < R * 1.02) return;
    const blink = 0.3 + Math.abs(Math.sin(t * 1.5 + p.blink)) * 0.65;
    ctx.globalAlpha = blink * p.depth * 0.9;
    ctx.fillStyle = p.color;
    if (p.rect) ctx.fillRect(px, py, p.size, p.size * 1.7);
    else { ctx.beginPath(); ctx.arc(px, py, p.size * 0.6, 0, Math.PI * 2); ctx.fill(); }
  });
  ctx.globalAlpha = 1;

  // pedestal
  const pedY = CY + R * 1.17, pedRx = R * 0.95, pedRy = R * 0.21;
  const pool = ctx.createRadialGradient(CX, pedY, 0, CX, pedY, pedRx * 1.3);
  pool.addColorStop(0, `rgba(255, 80, 50, ${0.24 + flare * 0.2})`);
  pool.addColorStop(0.5, "rgba(255, 110, 60, 0.08)");
  pool.addColorStop(1, "transparent");
  ctx.fillStyle = pool;
  ctx.fillRect(CX - pedRx * 1.35, pedY - pedRy * 2.5, pedRx * 2.7, pedRy * 4.6);

  [...TOWERS].sort((a, b) => Math.sin(a.a) - Math.sin(b.a)).forEach(tw => {
    const tx = CX + Math.cos(tw.a) * tw.rr * pedRx;
    const tz = Math.sin(tw.a);
    const ty = pedY + tz * tw.rr * pedRy;
    const grow = 0.7 + Math.sin(t * 1.2 + tw.ph) * 0.18 + flare * 0.5;
    const th = tw.h * grow * (0.7 + (tz + 1) * 0.25) * (R / 180);
    const twd = 2.6 * (0.7 + (tz + 1) * 0.25);
    const a = 0.38 + (tz + 1) * 0.3;
    ctx.fillStyle = hexA(tw.c, a);
    ctx.fillRect(tx - twd / 2, ty - th, twd, th);
    ctx.fillStyle = hexA("#ffe0b0", a * 0.95);
    ctx.fillRect(tx - twd / 2, ty - th, twd, 1.3);
  });

  // globe
  const halo = ctx.createRadialGradient(CX, CY, R * 0.8, CX, CY, R * 1.75);
  halo.addColorStop(0, `rgba(47, 126, 168, ${0.22 + beat * 0.05 + flare * 0.1})`);
  halo.addColorStop(0.6, "rgba(47, 126, 168, 0.05)");
  halo.addColorStop(1, "transparent");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(CX, CY, R * 1.75, 0, Math.PI * 2); ctx.fill();

  const body = ctx.createRadialGradient(CX - R*0.3, CY - R*0.32, R*0.1, CX, CY, R);
  body.addColorStop(0, "rgba(28, 64, 105, 0.6)");
  body.addColorStop(0.65, "rgba(9, 24, 52, 0.75)");
  body.addColorStop(1, "rgba(3, 8, 22, 0.88)");
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.fillStyle = body; ctx.fill();

  const coreR = R * (0.36 + beat * 0.03 + flare * 0.12);
  const core = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR);
  core.addColorStop(0, `rgba(255, 220, 160, ${0.5 + flare * 0.5})`);
  core.addColorStop(0.4, `rgba(255, 150, 80, ${0.24 + flare * 0.3})`);
  core.addColorStop(1, "transparent");
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(CX, CY, coreR, 0, Math.PI * 2); ctx.fill();

  // grid
  for (let lon = 0; lon < 360; lon += 20) {
    ctx.beginPath();
    let started = false;
    for (let lat = -85; lat <= 85; lat += 5) {
      const p = sph(lat, lon, rot.y, rot.x);
      if (p[2] > 0) {
        const sx2 = CX + p[0] * R, sy2 = CY - p[1] * R;
        if (!started) { ctx.moveTo(sx2, sy2); started = true; } else ctx.lineTo(sx2, sy2);
      } else started = false;
    }
    ctx.strokeStyle = "rgba(58, 143, 208, 0.20)";
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }
  for (let lat = -75; lat <= 75; lat += 15) {
    ctx.beginPath();
    let started = false;
    for (let lon = 0; lon <= 360; lon += 5) {
      const p = sph(lat, lon, rot.y, rot.x);
      if (p[2] > 0) {
        const sx2 = CX + p[0] * R, sy2 = CY - p[1] * R;
        if (!started) { ctx.moveTo(sx2, sy2); started = true; } else ctx.lineTo(sx2, sy2);
      } else started = false;
    }
    ctx.strokeStyle = `rgba(58, 143, 208, ${Math.abs(lat) < 5 ? 0.30 : 0.18})`;
    ctx.lineWidth = Math.abs(lat) < 5 ? 1 : 0.7;
    ctx.stroke();
  }

  // continents
  OCEAN_DOTS.forEach(d => {
    const p = sph(d.lat, d.lon, rot.y, rot.x);
    if (p[2] <= 0.02) return;
    ctx.fillStyle = `rgba(47, 126, 168, ${0.17 * p[2]})`;
    ctx.fillRect(CX + p[0] * R - 0.8, CY - p[1] * R - 0.8, 1.6, 1.6);
  });
  LAND_DOTS.forEach(d => {
    const p = sph(d.lat, d.lon, rot.y, rot.x);
    if (p[2] <= 0.02) return;
    const tw = 0.6 + Math.abs(Math.sin(t * 1.1 + d.j)) * 0.4 + flare * 0.35;
    const sz = (1.7 + p[2] * 1.5) * (R / 200);
    ctx.fillStyle = hexA(d.c, Math.min(1, tw * p[2]));
    ctx.fillRect(CX + p[0] * R - sz/2, CY - p[1] * R - sz/2, sz, sz);
  });

  const CHIPS_ALL = allBeliefs();
  const aliveOf = c => { const a = ep - c.born; return a < 0 ? 0 : Math.min(1, 0.35 + a * 8); };
  const pos3 = {};
  CHIPS_ALL.forEach(c => { pos3[c.id] = sph(c.lat, c.lon, rot.y, rot.x); });

  function drawArc(aId, bId, color, storm, intensity) {
    const A = CHIPS_ALL.find(c => c.id === aId), B = CHIPS_ALL.find(c => c.id === bId);
    if (!A || !B) return;
    const al = Math.min(aliveOf(A), aliveOf(B));
    if (al <= 0) return;
    const pa = pos3[aId], pb = pos3[bId];
    let mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2, mz = (pa[2]+pb[2])/2;
    const ml = Math.hypot(mx, my, mz) || 1;
    const lift = 1.3 + 0.25 * (1 - (pa[0]*pb[0] + pa[1]*pb[1] + pa[2]*pb[2]));
    mx = mx/ml*lift; my = my/ml*lift; mz = mz/ml*lift;
    const inten = intensity || 1;
    const flick = storm ? (Math.sin(t * 9 + pa[0] * 10) > 0.5 ? 1 : 0.3) * inten : 1;
    let prev = null;
    for (let i = 0; i <= 30; i++) {
      const f = i / 30, u = 1 - f;
      let px = u*u*pa[0] + 2*u*f*mx + f*f*pb[0];
      let py = u*u*pa[1] + 2*u*f*my + f*f*pb[1];
      const pz = u*u*pa[2] + 2*u*f*mz + f*f*pb[2];
      if (storm) {
        px += Math.sin(t*14 + i*5.3) * 0.018 * Math.sin(f*Math.PI) * inten;
        py += Math.cos(t*12 + i*3.9) * 0.018 * Math.sin(f*Math.PI) * inten;
      }
      const sx2 = CX + px * R, sy2 = CY - py * R;
      const vis = pz > -0.1;
      if (prev && vis && prev.vis) {
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y); ctx.lineTo(sx2, sy2);
        ctx.strokeStyle = hexA(color, (0.15 + Math.sin(f*Math.PI)*0.5) * flick * al);
        ctx.lineWidth = storm ? 1.1 : 0.9;
        ctx.stroke();
      }
      prev = { x: sx2, y: sy2, vis };
    }
    if (!storm) {
      const prog = (t * 0.14 + aId.charCodeAt(2) * 0.13) % 1;
      const u = 1 - prog;
      const px = u*u*pa[0] + 2*u*prog*mx + prog*prog*pb[0];
      const py = u*u*pa[1] + 2*u*prog*my + prog*prog*pb[1];
      const pz = u*u*pa[2] + 2*u*prog*mz + prog*prog*pb[2];
      if (pz > -0.05) {
        ctx.beginPath(); ctx.arc(CX + px*R, CY - py*R, 1.8, 0, Math.PI*2);
        ctx.fillStyle = PAL.goldHot;
        ctx.shadowColor = PAL.gold; ctx.shadowBlur = 9;
        ctx.fill(); ctx.shadowBlur = 0;
      }
    }
  }
  allGoldPairs().forEach(pr => drawArc(pr[0], pr[1], PAL.gold, false));
  allStormPairs().forEach(pr => drawArc(pr[0], pr[1], PAL.red, true, pr[2]));

  // chips
  const cs = {};
  [...CHIPS_ALL].sort((a,b) => pos3[a.id][2] - pos3[b.id][2]).forEach(c => {
    const al = aliveOf(c);
    if (al <= 0) { cs[c.id] = null; return; }
    const p = pos3[c.id];
    if (p[2] <= 0.05) { cs[c.id] = null; return; }
    const sx2 = CX + p[0] * R, sy2 = CY - p[1] * R;
    cs[c.id] = [sx2, sy2];
    const isFocus = S.focus && S.focus.id === c.id;
    const scale = (R / 200) * (0.8 + p[2] * 0.4) * (isFocus ? 1.55 : 1);
    const cw = 13.5 * scale, ch2 = 9.5 * scale;

    const g = ctx.createRadialGradient(sx2, sy2, 0, sx2, sy2, cw * 2.4);
    g.addColorStop(0, hexA(c.color, 0.55 * al * p[2]));
    g.addColorStop(1, "transparent");
    ctx.fillStyle = g;
    ctx.fillRect(sx2 - cw*2.4, sy2 - cw*2.4, cw*4.8, cw*4.8);

    ctx.globalAlpha = al * (0.7 + p[2] * 0.3);
    ctx.fillStyle = "rgba(6, 12, 28, 0.88)";
    ctx.fillRect(sx2 - cw/2, sy2 - ch2/2, cw, ch2);
    ctx.strokeStyle = c.color;
    ctx.lineWidth = isFocus ? 1.5 : 1;
    ctx.strokeRect(sx2 - cw/2, sy2 - ch2/2, cw, ch2);
    ctx.fillStyle = c.color;
    ctx.fillRect(sx2 - cw*0.3, sy2 - ch2*0.22, cw*0.18, ch2*0.44);
    ctx.fillRect(sx2 + cw*0.02, sy2 - ch2*0.06, cw*0.32, ch2*0.16);
    ctx.fillRect(sx2 + cw*0.02, sy2 + ch2*0.14, cw*0.2, ch2*0.1);
    ctx.globalAlpha = 1;

    if (isFocus) {
      ctx.beginPath();
      ctx.arc(sx2, sy2, cw * 1.15 + Math.sin(t*2.6)*2, 0, Math.PI*2);
      ctx.strokeStyle = hexA(PAL.gold, 0.8);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  });
  chipScreen = cs;

  // limb
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(82, 184, 255, ${0.38 + flare * 0.35})`;
  ctx.lineWidth = 1.3;
  ctx.shadowColor = "rgba(82, 184, 255, 0.85)";
  ctx.shadowBlur = 17 + flare * 20;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // council orbits
  COUNCIL.forEach(m => {
    const orbR = R * (1.48 - summonAmt * 0.32);
    const ang = t * m.speed * (1 + summonAmt * 0.8) + m.phase;
    const ox = Math.cos(ang) * orbR;
    const oy = Math.sin(ang) * orbR * Math.cos(m.incl) * 0.42;
    const oz = Math.sin(ang) * Math.sin(m.incl);
    const sx2 = CX + ox, sy2 = CY + oy;
    const front = oz >= 0;
    const a = front ? 0.95 : 0.30;

    ctx.beginPath();
    for (let k = 0; k <= 40; k++) {
      const ta = ang - k * 0.05;
      const tx2 = CX + Math.cos(ta) * orbR;
      const ty2 = CY + Math.sin(ta) * orbR * Math.cos(m.incl) * 0.42;
      if (k === 0) ctx.moveTo(tx2, ty2); else ctx.lineTo(tx2, ty2);
    }
    ctx.strokeStyle = hexA(m.color, 0.15 * a);
    ctx.lineWidth = 0.8;
    ctx.stroke();

    const er = 4 + summonAmt * 2.5;
    const g = ctx.createRadialGradient(sx2, sy2, 0, sx2, sy2, er * 3.5);
    g.addColorStop(0, hexA(m.color, 0.6 * a));
    g.addColorStop(1, "transparent");
    ctx.fillStyle = g;
    ctx.fillRect(sx2 - er*3.5, sy2 - er*3.5, er*7, er*7);
    ctx.beginPath(); ctx.arc(sx2, sy2, er, 0, Math.PI*2);
    ctx.fillStyle = hexA(m.color, a);
    ctx.fill();
    ctx.fillStyle = "#03030a";
    ctx.font = (er + 2) + "px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(m.glyph, sx2, sy2 + 0.5);
    ctx.textBaseline = "alphabetic";

    if (summonAmt > 0.5 && front) {
      ctx.font = "300 9px Inter, sans-serif";
      ctx.fillStyle = hexA(m.color, 0.87);
      ctx.fillText(m.name.toUpperCase(), sx2, sy2 - er - 7);
    }
  });

  const vg = ctx.createRadialGradient(CX, CY, Math.min(w,h)*0.32, CX, CY, Math.max(w,h)*0.82);
  vg.addColorStop(0, "transparent");
  vg.addColorStop(1, "rgba(3, 3, 9, 0.84)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  requestAnimationFrame(draw);
}

/* ── DOM HELPERS ── */
const $ = id => document.getElementById(id);
function show(id, on) { $(id).style.display = on ? "" : "none"; }
function setStatusLine() {
  const n = allBeliefs().length;
  const storms = allStormPairs().length;
  $("stat1").textContent = n + " belief" + (n===1?"":"s") + " held";
  $("stat2").textContent = storms ? (storms + " storm" + (storms>1?"s":"") + " active") : "skies clear";
  $("stat2").style.color = storms ? "#ff7060" : PAL.dim;
  $("stat3").textContent = S.beliefs.length + " sealed by you";
  $("modeTag").textContent = S.apiKey === "artifact" ? "council: live" :
    S.apiKey ? "studio: live" : "council: offline";
}

/* ── FOCUS / CAPTION ── */
function esc(s2) { return String(s2).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function showFocus(b) {
  S.focus = b;
  if (!b) { show("caption", false); return; }
  $("capRegion").textContent = b.region + (b.receipt ? " · sealed" : "");
  $("capRegion").style.color = b.color;
  $("capLabel").textContent = b.label;
  $("capDetail").textContent = b.detail;
  let meta = "";
  if (b.receipt) {
    meta = "claim " + b.receipt.claim_id.slice(0,8) + " · " + b.receipt.winner +
      " led · integrity " + b.receipt.integrity.toFixed(4) +
      " · dissent " + b.receipt.dissent.length + " preserved";
  } else {
    meta = "confidence " + Math.round(b.conf * 100) + "% · b. " + b.born.toFixed(1);
  }
  $("capMeta").textContent = meta;
  // lineage (fix #3)
  let lin = "";
  if (b.evidence && b.evidence.length) {
    lin += b.evidence.map(e => "◦ " + esc(e)).join("<br>");
  }
  if (b.revisions && b.revisions.length) {
    const last = b.revisions[b.revisions.length-1];
    lin += (lin ? "<br>" : "") + "↻ " + Math.round(last.from*100) + "% → " +
      Math.round(last.to*100) + "% (" + last.why + ")";
  }
  if (b.contradicts && b.contradicts.length) {
    lin += (lin ? "<br>" : "") + "⚡ contradicts " + b.contradicts.length + " held belief" + (b.contradicts.length>1?"s":"");
  }
  $("capLineage").innerHTML = lin;
  show("caption", true);
}

/* ── DELIBERATION FLOW ── */
const PHASES = ["Receiving proposition","Council convening","Claims generated",
  "Counter-weights exchanged","Integrity scored","Verdict sealed"];
const wait = ms => new Promise(r => setTimeout(r, ms));

async function pose() {
  const q = $("entry").value.trim();
  if (!q || S.deliberating) return;
  $("entry").value = "";
  showFocus(null);
  S.deliberating = true;
  $("entry").disabled = true;
  $("entry").placeholder = "The council is deliberating…";
  $("goBtn").classList.remove("ready");
  show("firstRun", false);

  const existing = allBeliefs();

  // kick off the real reasoning while theater plays
  let resultPromise;
  if (S.apiKey) {
    resultPromise = apiDeliberate(q, existing, S.apiKey === "artifact" ? null : S.apiKey)
      .catch(() => localDeliberate(q, existing));
  } else {
    resultPromise = Promise.resolve(localDeliberate(q, existing));
  }

  for (let i = 0; i < 2; i++) {
    $("phaseText").textContent = PHASES[i];
    show("phaseWrap", true);
    await wait(900);
  }

  const result = await resultPromise;
  const { winner, dissent, consensusPct } = scoreAndResolve(result.members);

  // members speak their real arguments
  for (let i = 2; i < PHASES.length; i++) {
    $("phaseText").textContent = PHASES[i];
    if (i === 2 || i === 3) {
      const half = i === 2 ? result.members.slice(0, 3) : result.members.slice(3);
      for (const mem of half) {
        const m = COUNCIL_BY_ID[mem.id];
        $("speakName").textContent = m.glyph + " " + m.name + " — " + mem.stance;
        $("speakName").style.color = m.color;
        $("speakLine").textContent = "“" + mem.argument + "”";
        show("speakWrap", true);
        await wait(1700);
      }
      show("speakWrap", false);
    } else {
      await wait(850);
    }
  }
  show("phaseWrap", false);

  // build belief
  const pHash = hash16(q);
  const region = REGIONS[result.regionKey];
  const jitter = ((parseInt(pHash.slice(0,4),16) % 17) - 8);
  const stance = winner.stance;
  const verdictText = result.verdictText ||
    (stance === "affirms"
      ? "The Council holds this likely true. " + (6 - dissent.length) + " of 6 affirm, led by " + COUNCIL_BY_ID[winner.id].name + "."
      : "The Council holds this doubtful. " + (6 - dissent.length) + " of 6 doubt, led by " + COUNCIL_BY_ID[winner.id].name + ".");

  const contradictIds = result.contradicts.map(i => existing[i] && existing[i].id).filter(Boolean);

  const belief = {
    id: "u_" + pHash.slice(0, 8) + "_" + Date.now().toString(36),
    proposition: q,
    lat: Math.max(-60, Math.min(65, region.lat + jitter)),
    lon: region.lon + ((parseInt(pHash.slice(4,8),16) % 25) - 12),
    color: stance === "affirms" ? CHIPCOLORS[parseInt(pHash.slice(8,9),16) % 6] : PAL.red,
    label: q.length > 52 ? q.slice(0, 49) + "…" : q,
    region: region.name,
    detail: verdictText,
    conf: consensusPct / 100,
    born: 2026.55,
    evidence: result.evidenceLines,
    contradicts: contradictIds,
    stormIntensity: contradictIds.length ? 0.9 : 0,
    revisions: [],
    receipt: {
      claim_id: hash16(winner.id + pHash),
      winner: COUNCIL_BY_ID[winner.id].name,
      integrity: winner.integrity,
      consensus: consensusPct,
      mode: result.mode,
      dissent: dissent.map(d => ({ name: COUNCIL_BY_ID[d.id].name, argument: d.argument })),
      members: result.members.map(m => ({ id: m.id, stance: m.stance,
        evidence: m.evidence, confidence: m.confidence, argument: m.argument,
        integrity: m.integrity })),
      timestamp: new Date().toISOString(),
    },
  };

  S.beliefs.push(belief);
  await store.set("concord-beliefs", JSON.stringify(S.beliefs));
  await store.set("concord-lastvisit", String(Date.now()));

  S.flare = 1;
  if (contradictIds.length) {
    S.stormFlash = 1; // the sky answers a new storm
  }

  S.deliberating = false;
  $("entry").disabled = false;
  $("entry").placeholder = "Pose a proposition to the world…";
  setStatusLine();

  rot.tyaw = -belief.lon * D2R;
  rot.tpitch = Math.max(-0.7, Math.min(0.7, belief.lat * D2R * 0.55));
  rot.tzoom = 1.5;
  showFocus(belief);
}

/* ── POINTER ── */
function hitChip(mx, my) {
  let best = null, bd = 30;
  for (const c of allBeliefs()) {
    const p = chipScreen[c.id];
    if (!p) continue;
    const d = Math.hypot(p[0]-mx, p[1]-my);
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}
const pointers = new Map();
let pinchDist = 0;
canvas.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) {
    const pts = [...pointers.values()];
    pinchDist = Math.hypot(pts[0][0]-pts[1][0], pts[0][1]-pts[1][1]);
    drag = null;
  } else {
    drag = { x: e.clientX, y: e.clientY, moved: false, ry: rot.y, rx: rot.x };
  }
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  rot.tzoom = Math.max(0.6, Math.min(2.6, rot.tzoom * (e.deltaY > 0 ? 0.92 : 1.09)));
}, { passive: false });
window.addEventListener("pointermove", e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0][0]-pts[1][0], pts[0][1]-pts[1][1]);
    if (pinchDist > 0) {
      rot.tzoom = Math.max(0.6, Math.min(2.6, rot.tzoom * (d / pinchDist)));
      rot.zoom = rot.tzoom;
    }
    pinchDist = d;
    return;
  }
  if (!drag) {
    canvas.style.cursor = hitChip(e.clientX, e.clientY) ? "pointer" : "grab";
    return;
  }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  rot.y = drag.ry + dx * 0.005;
  rot.x = Math.max(-0.9, Math.min(0.9, drag.rx - dy * 0.004));
  rot.tyaw = null;
});
window.addEventListener("pointerup", e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  const moved = drag && drag.moved;
  drag = null;
  if (moved || S.deliberating) return;
  if (e.target !== canvas) return;
  const hit = hitChip(e.clientX, e.clientY);
  if (hit) {
    rot.tyaw = -hit.lon * D2R;
    rot.tpitch = Math.max(-0.7, Math.min(0.7, hit.lat * D2R * 0.55));
    rot.tzoom = 1.5;
    showFocus(hit);
  } else {
    rot.tzoom = 1;
    showFocus(null);
  }
});

/* ── UI WIRING ── */
$("entry").addEventListener("keydown", e => {
  if (e.key === "Enter") pose();
});
$("entry").addEventListener("input", () => {
  $("goBtn").classList.toggle("ready", !!$("entry").value.trim());
});
$("goBtn").addEventListener("click", pose);
$("epoch").addEventListener("input", e => {
  S.epoch = parseFloat(e.target.value);
  $("epochLabel").textContent = S.epoch >= 2026.55 ? "NOW" : String(Math.floor(S.epoch));
});
$("seedsBtn").addEventListener("click", async () => {
  S.seedsOn = !S.seedsOn;
  $("seedsBtn").textContent = S.seedsOn ? "Hide exemplars" : "Show exemplars";
  await store.set("concord-seeds", S.seedsOn ? "1" : "0");
  setStatusLine();
  if (allBeliefs().length) show("firstRun", false);
  else show("firstRun", true);
});
$("keyBtn").addEventListener("click", async () => {
  const k = prompt("Anthropic API key (stored locally, never sent anywhere but api.anthropic.com):", "");
  if (k && k.trim()) {
    S.apiKey = k.trim();
    await store.set("concord-key", S.apiKey);
    setStatusLine();
  }
});

/* ── BOOT ── */
(async function boot() {
  try {
    const raw = await store.get("concord-beliefs");
    if (raw) S.beliefs = JSON.parse(raw) || [];
  } catch(e) {}
  try {
    const sd = await store.get("concord-seeds");
    S.seedsOn = sd === "1";
    $("seedsBtn").textContent = S.seedsOn ? "Hide exemplars" : "Show exemplars";
  } catch(e) {}
  try {
    const k = await store.get("concord-key");
    if (k) S.apiKey = k;
  } catch(e) {}

  // detect artifact environment (keyless API works there)
  if (!S.apiKey) {
    try {
      const ping = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1,
          messages: [{ role: "user", content: "." }] }),
      });
      if (ping.ok) S.apiKey = "artifact";
    } catch(e) {}
  }

  // weather while away (fix #4)
  try {
    const lv = await store.get("concord-lastvisit");
    if (lv) {
      const daysAway = (Date.now() - parseInt(lv, 10)) / 86400000;
      const note = applyWeather(daysAway);
      if (note) {
        S.weatherNote = note;
        $("weatherText").textContent = note;
        show("weatherWrap", true);
        setTimeout(() => show("weatherWrap", false), 9000);
        await store.set("concord-beliefs", JSON.stringify(S.beliefs));
      }
    }
  } catch(e) {}
  await store.set("concord-lastvisit", String(Date.now()));

  // first-run (fix #5)
  show("firstRun", allBeliefs().length === 0);

  setStatusLine();
  setTimeout(() => { document.body.classList.add("entered"); }, 250);
  requestAnimationFrame(draw);
})();
</script>

<script id="CONCORD_AUTONOMOUS_COUNCIL_V2">
(() => {
  const KEY = "omniauthor-belief-ledger-v1";
  const AUTO_KEY = "omniauthor-autonomous-council-enabled";

  const agents = {
    Architect: "systems, structure, scaffolding, implementation",
    Skeptic: "failure modes, doubt, contradiction, weak assumptions",
    Scientist: "evidence, testing, measurement, falsifiability",
    Historian: "precedent, pattern, lineage, prior examples",
    Auditor: "consistency, rules, provenance, integrity",
    Strategist: "usefulness, timing, leverage, next move"
  };

  const seedClaims = [
    "Reasoning without memory collapses into repetition.",
    "A belief becomes stronger when it survives contradiction.",
    "A council becomes intelligent when its members disagree productively.",
    "Truth requires provenance, not just confidence.",
    "A living knowledge system must revise itself without erasing its past.",
    "Contradiction is not failure; it is unresolved structure.",
    "A system that preserves dissent becomes more trustworthy over time."
  ];

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
    catch { return []; }
  }

  function save(items){
    localStorage.setItem(KEY, JSON.stringify(items.slice(0, 500)));
  }

  function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function id(prefix="claim"){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
  }

  function agentResponse(agent, text){
    const lens = agents[agent];
    const templates = [
      `${agent} examines "${text}" through ${lens}.`,
      `${agent} preserves the useful structure but marks uncertainty around "${text}".`,
      `${agent} identifies this as a candidate belief requiring future evidence: "${text}".`,
      `${agent} links this proposition to the broader map: "${text}".`
    ];
    return pick(templates);
  }

  function relate(newBelief, items){
    const words = newBelief.text.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 4);
    const related = [];

    for (const b of items) {
      if (!b.text) continue;
      const t = b.text.toLowerCase();
      const score = words.filter(w => t.includes(w)).length;
      if (score > 0) related.push({ id: b.id, score });
    }

    related.sort((a,b) => b.score - a.score);
    newBelief.related = related.slice(0,5).map(x => x.id);
    newBelief.supports = [];
    newBelief.contradicts = [];

    if (/not|false|fail|contradict|doubt|weak|risk/i.test(newBelief.text)) {
      newBelief.status = "contested";
    }

    return newBelief;
  }

  function synthesize(items){
    if (!items.length) return pick(seedClaims);

    const a = pick(items);
    const b = pick(items);

    if (a && b && a.id !== b.id) {
      return `Synthesize relationship between "${a.text}" and "${b.text}".`;
    }

    return `Reconsider this belief under pressure: "${a.text || pick(seedClaims)}".`;
  }

  function deliberate(text, origin="autonomous"){
    const items = load();
    const council = {};
    Object.keys(agents).forEach(a => council[a] = agentResponse(a, text));

    const affirm = Math.floor(2 + Math.random() * 4);
    const dissent = Math.floor(Math.random() * 3);
    const preserve = Math.max(0, 6 - affirm - dissent);

    let belief = {
      id: id(origin === "human" ? "human" : "auto"),
      text,
      created_at: new Date().toISOString(),
      origin,
      status: dissent > 1 ? "contested" : "accepted",
      confidence: +(0.52 + Math.random() * 0.38).toFixed(4),
      integrity: +(0.60 + Math.random() * 0.35).toFixed(4),
      council,
      tally: { affirm, dissent, preserve },
      verdict: `Council verdict: ${affirm}/6 affirm, ${dissent} dissent, ${preserve} preserved.`,
      derived_from: items.slice(0,2).map(x => x.id).filter(Boolean),
      related: [],
      supports: [],
      contradicts: []
    };

    belief = relate(belief, items);
    items.unshift(belief);
    save(items);

    renderBelief(belief);
    return belief;
  }

  function evolve(){
    const items = load();
    const text = synthesize(items);
    return deliberate(text, "autonomous");
  }

  function renderBelief(belief){
    const caption = document.querySelector(".a");
    if (caption) {
      caption.innerHTML =
        `${escapeHtml(belief.text)}<br>` +
        `<span style="font-size:12px;color:#aab6d4">${belief.verdict} · integrity ${belief.integrity}</span>`;
    }

    const mode = document.querySelector("#modeTag");
    if (mode) mode.textContent = "council: growing";

<script id="CONCORD_TRANSCENDENT_CORE_V3">

  const agents=["Architect","Skeptic","Scientist","Historian","Auditor","Strategist","Dreamer","Judge","Cartographer"];

  function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}}
  function save(x){localStorage.setItem(KEY,JSON.stringify(x.slice(0,777)))}
  function uid(p="node"){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function words(t){return String(t).toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>4)}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

  function scoreRelation(a,b){
    const aw=words(a), bt=String(b).toLowerCase();
    return aw.filter(w=>bt.includes(w)).length;
  }

  function detectContradictions(text,items){
    const neg=/\b(not|never|false|cannot|fail|opposite|contradict|deny|wrong|unstable)\b/i.test(text);
    return items.filter(b=>{
      const rel=scoreRelation(text,b.text||"");
      const bneg=/\b(not|never|false|cannot|fail|opposite|contradict|deny|wrong|unstable)\b/i.test(b.text||"");
      return rel>0 && neg!==bneg;
    }).slice(0,5).map(b=>b.id);
  }

  function council(text,parents=[]){
    const map={};
    for(const a of agents){
      map[a]=`${a}: ${a==="Skeptic"?"challenge":a==="Scientist"?"test":a==="Auditor"?"verify":a==="Cartographer"?"connect":"interpret"} "${text}"`;
    }
    return map;
  }

  function create(text,origin="transcendent",parents=[]){
    const items=load();
    const related=items.map(b=>({id:b.id,score:scoreRelation(text,b.text||"")})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,7).map(x=>x.id);
    const contradicts=detectContradictions(text,items);
    const affirm=Math.max(1,Math.floor(3+Math.random()*4)-contradicts.length);
    const dissent=Math.min(5,contradicts.length+Math.floor(Math.random()*2));
    const preserve=Math.max(0,agents.length-affirm-dissent);
    const confidence=+(0.48+Math.random()*0.42-(contradicts.length*.04)).toFixed(4);
    const integrity=+(0.60+Math.random()*0.35+(related.length*.005)).toFixed(4);

    const node={
      id:uid(origin==="human"?"human":"auto"),
      text,
      created_at:new Date().toISOString(),
      origin,
      status:contradicts.length?"contested":"accepted",
      confidence,
      integrity,
      council:council(text,parents),
      tally:{affirm,dissent,preserve},
      verdict:`Council synthesis: ${affirm}/${agents.length} affirm, ${dissent} dissent, ${preserve} preserved.`,
      derived_from:parents,
      related,
      supports:related.slice(0,3),
      contradicts,
      generation:parents.length?1+Math.max(0,...items.filter(x=>parents.includes(x.id)).map(x=>x.generation||0)):0
    };

    save(items);
    render(node);

      items.map(x=>`<div style="border-bottom:1px solid rgba(255,255,255,.08);padding:9px 0">
      <div style="color:${(x.contradicts||[]).length?'#ff6b35':'#00e5cc'}">${esc(x.id)} · ${esc(x.status)} · gen ${x.generation||0}</div>

    const neg=/not|never|false|wrong|fail|contradict|unstable|deny|risk|danger/i.test(text);
    const contradicts=items.filter(x=>relation(text,x.text)>0 && neg!==/not|never|false|wrong|fail|contradict|unstable|deny|risk|danger/i.test(x.text||"")).slice(0,6).map(x=>x.id);
    const gen=parents.length?1+Math.max(0,...items.filter(x=>parents.includes(x.id)).map(x=>x.generation||0)):0;

    const council={}; AGENTS.forEach(a=>council[a]=agentLine(a,text));

    const node={
      id:id(origin==="human"?"human":"auto"),
      text,origin,created_at:new Date().toISOString(),generation:gen,
      status:contradicts.length?"contested":"active",
      confidence:+(0.52+Math.random()*.38-contradicts.length*.035).toFixed(4),
      integrity:+(0.62+Math.random()*.33+related.length*.004).toFixed(4),
      council,
      reputation:Object.fromEntries(AGENTS.map((a,i)=>[a, +(0.62+Math.random()*.32).toFixed(3)])),
      tally:{affirm:Math.max(1,6-contradicts.length),dissent:contradicts.length,preserve:Math.floor(1+Math.random()*3)},
      derived_from:parents,related,supports:related.slice(0,4),contradicts,
      questions:[`What would disprove this?`,`What evidence strengthens this?`,`What assumption hides beneath this?`],
      verdict:contradicts.length?"Accepted under contradiction watch.":"Accepted into active working memory."
    };

    items.unshift(node); save(items); render(node); return node;
  }

  function synth(){
    const l=load(); if(l.length<2)return create("A self-growing council begins by remembering and revising itself.","seed",[]);
    const a=pick(l),b=pick(l); return create(`Synthesize "${a.text}" with "${b.text}" into a higher-order principle.`,"synthesis",[a.id,b.id]);
  }
  function challenge(){const l=load(); if(!l.length)return synth(); const a=pick(l); return create(`Challenge this belief until only its strongest structure remains: "${a.text}".`,"challenge",[a.id])}
  function predict(){const l=load(); if(!l.length)return synth(); const a=pick(l); return create(`Prediction: if "${a.text}" is true, future observations should reveal a repeatable pattern.`,"prediction",[a.id])}
  function dream(){return create(pick(["Which contradiction is a doorway?","What does this system not yet know?","Which belief should die for honesty?","What pattern repeats across the ledger?"]),"dream",load().slice(0,3).map(x=>x.id))}
  function evolve(){return pick([synth,challenge,predict,dream])()}

  function ensureUI(){
    if(!document.getElementById("concordDock")){
      const dock=document.createElement("div"); dock.id="concordDock";
      const buttons=[
        ["COUNCIL",()=>show("council")],["LEDGER",()=>show("ledger")],["GRAPH",()=>show("graph")],
        ["SYNTH",()=>synth()],["CHALLENGE",()=>challenge()],["PREDICT",()=>predict()],
        ["DREAM",()=>dream()],["AUTO",()=>{localStorage.setItem(RUN,"1");create("Autonomous evolution enabled.","system",[])}],
        ["STOP",()=>{localStorage.setItem(RUN,"0");create("Autonomous evolution paused.","system",[])}]
      ];
      buttons.forEach(([t,f])=>{const b=document.createElement("button");b.textContent=t;b.onclick=f;dock.appendChild(b)});
      document.body.appendChild(dock);
    }
    ["council","ledger","graph"].forEach(n=>{
      if(!document.getElementById("cc_"+n)){
        const p=document.createElement("div");p.id="cc_"+n;p.className="concordPanel";document.body.appendChild(p);
      }
    });
  }

  function show(name){
    ensureUI();
    ["council","ledger","graph"].forEach(n=>document.getElementById("cc_"+n).style.display=n===name&&document.getElementById("cc_"+n).style.display==="none"?"block":"none");
    draw();
  }

  function draw(){
    const l=load(), latest=l[0];
    const ledger=document.getElementById("cc_ledger");
    const council=document.getElementById("cc_council");
    const graph=document.getElementById("cc_graph");

    if(ledger) ledger.innerHTML=`<div class="concordTitle">LIVING LEDGER · ${l.length}</div>`+
      l.slice(0,35).map(x=>`<div class="concordCard">
        <div class="${(x.contradicts||[]).length?'concordWarn':'concordGood'}">${esc(x.id)} · ${esc(x.origin)} · gen ${x.generation||0}</div>
        <div>${esc(x.text)}</div><div class="concordDim">${esc(x.verdict)} · confidence ${x.confidence} · integrity ${x.integrity}</div>
        <div class="concordDim">related ${(x.related||[]).length} · contradicts ${(x.contradicts||[]).length}</div>
      </div>`).join("");

    if(council) council.innerHTML=`<div class="concordTitle">COUNCIL CHAMBER</div>`+
      (latest?Object.entries(latest.council||{}).map(([a,v])=>`<div class="concordCard"><div class="concordGood">${esc(a)} · trust ${esc(latest.reputation?.[a]??"")}</div><div>${esc(v)}</div></div>`).join(""):"No council activity yet.");

    if(graph) graph.innerHTML=`<div class="concordTitle">KNOWLEDGE GRAPH</div>`+
      l.slice(0,25).map(x=>`<div class="concordCard">
        <div class="concordGood">${esc(x.id)}</div>
        <div>${esc(x.text)}</div>
        <div class="concordDim">supports: ${(x.supports||[]).join(", ")||"—"}</div>
        <div class="concordDim">contradicts: ${(x.contradicts||[]).join(", ")||"—"}</div>
        <div class="concordDim">derived from: ${(x.derived_from||[]).join(", ")||"—"}</div>
      </div>`).join("");
  }

  function render(b){
    const cap=document.querySelector(".a");
    if(cap)cap.innerHTML=`${esc(b.text)}<br><span style="font-size:12px;color:#aab6d4">${esc(b.verdict)} · gen ${b.generation} · integrity ${b.integrity}</span>`;
    const mode=document.querySelector("#modeTag"); if(mode)mode.textContent=localStorage.getItem(RUN)==="1"?"omega: autonomous":"omega: evolving";
    draw();
  }

  function hook(){
    ensureUI();
    const btn=[...document.querySelectorAll("button")].find(b=>/^DELIBERATE$/i.test((b.textContent||"").trim()));
    const input=document.querySelector("input,textarea");
    if(btn&&input&&!btn.dataset.commandCenter){
      btn.dataset.commandCenter="1";
      btn.addEventListener("click",()=>{const t=(input.value||"").trim();if(!t)return;input.value="";create(t,"human",[])},true);
    }
  }

  window.concordCommand={create,synth,challenge,predict,dream,evolve,ledger:load,start(){localStorage.setItem(RUN,"1")},stop(){localStorage.setItem(RUN,"0")},status(){return{enabled:localStorage.getItem(RUN)==="1",ledger_size:load().length}}};

  setInterval(hook,1000);
  setInterval(()=>{if(localStorage.getItem(RUN)==="1")evolve()},60000);
  hook();
  console.log("CONCORD_COMMAND_CENTER_V5 ready");
})();
</script>


<script id="CONCORD_PRIME_CORE_V6">
(() => {
  const BELIEFS="omniauthor-belief-ledger-v1";
  const AGENTS_KEY="concord-agent-memory-v1";
  const QUESTIONS_KEY="concord-open-questions-v1";
  const RUN="concord-prime-auto";

  const AGENTS=["Architect","Skeptic","Scientist","Historian","Auditor","Strategist","Cartographer","Dreamer","Judge"];

  function load(k,d=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
  function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
  function beliefs(){return load(BELIEFS,[])}
  function saveBeliefs(v){save(BELIEFS,v.slice(0,1500))}
  function id(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

  function initAgents(){
    let mem=load(AGENTS_KEY,{});
    AGENTS.forEach(a=>{
      if(!mem[a]) mem[a]={trust:.7,wins:0,losses:0,predictions:0,questions:0,bias:a,history:[]};
    });
    save(AGENTS_KEY,mem);
    return mem;
  }

  function agentSpeak(agent,text){
    const style={
      Architect:"Build the structure before admiring the vision.",
      Skeptic:"A belief that cannot survive attack is decoration.",
      Scientist:"Evidence is the tax every claim must pay.",
      Historian:"Patterns rarely introduce themselves as new.",
      Auditor:"If provenance is missing, confidence is theater.",
      Strategist:"A useful belief must change the next move.",
      Cartographer:"A lonely belief is an unmapped island.",
      Dreamer:"The impossible is often an undiscovered category.",
      Judge:"Preserve the dissent; decide provisionally."
    };
    return `${style[agent]} Applied to: "${text}"`;
  }

  function relate(text,items){
    const w=String(text).toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>4);
    return items.map(b=>{
      const bt=String(b.text||"").toLowerCase();
      return {id:b.id,score:w.filter(x=>bt.includes(x)).length};
    }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,10).map(x=>x.id);
  }

  function createBelief(text,origin="prime",parents=[]){
    const items=beliefs();
    const mem=initAgents();
    const related=relate(text,items);
    const contradicts=items.filter(b=>related.includes(b.id)&&/not|false|wrong|fail|deny|risk|contradict/i.test(text)!==/not|false|wrong|fail|deny|risk|contradict/i.test(b.text||"")).slice(0,6).map(b=>b.id);
    const council={};

    AGENTS.forEach(a=>{
      council[a]=agentSpeak(a,text);
      mem[a].history.unshift({at:new Date().toISOString(),belief:text.slice(0,120)});
      mem[a].history=mem[a].history.slice(0,20);
      mem[a].trust=+(mem[a].trust + (Math.random()-.45)*.015).toFixed(3);
      mem[a].trust=Math.max(.35,Math.min(.98,mem[a].trust));
    });

    const node={
      id:id(origin==="human"?"human":"prime"),
      text,
      origin,
      created_at:new Date().toISOString(),
      generation:parents.length?1:0,
      status:contradicts.length?"contested":"active",
      confidence:+(.54+Math.random()*.36-contradicts.length*.03).toFixed(4),
      integrity:+(.64+Math.random()*.30+related.length*.004).toFixed(4),
      council,
      agent_memory_snapshot:Object.fromEntries(AGENTS.map(a=>[a,mem[a].trust])),
      derived_from:parents,
      related,
      supports:related.slice(0,4),
      contradicts,
      predictions:[
        {id:id("pred"),text:`If true, this belief should produce consistent downstream support.`,status:"open"}
      ],
      questions:[
        "What evidence would change this belief?",
        "What contradiction applies pressure here?",
        "What useful action follows from this?"
      ],
      verdict:contradicts.length?"Prime Council preserved under contradiction watch.":"Prime Council accepted into working memory."
    };

    items.unshift(node);
    saveBeliefs(items);
    save(AGENTS_KEY,mem);
    renderPrime(node);
    return node;
  }

  function question(){
    const q=[
      "Which belief in the ledger is most fragile?",
      "Which accepted belief lacks evidence?",
      "Which contradiction should become a first-class object?",
      "What does the system repeatedly assume without testing?",
      "Which agent has too much influence?",
      "What prediction can be made from the strongest belief?"
    ];
    const qs=load(QUESTIONS_KEY,[]);
    const obj={id:id("q"),text:pick(q),created_at:new Date().toISOString(),status:"open"};
    qs.unshift(obj); save(QUESTIONS_KEY,qs.slice(0,200));
    return createBelief(`Open Question: ${obj.text}`,"curiosity",[]);
  }

  function selfAudit(){
    const mem=initAgents();
    const weakest=Object.entries(mem).sort((a,b)=>a[1].trust-b[1].trust)[0];
    return createBelief(`Self-audit: ${weakest[0]} currently has the lowest trust and should be challenged for calibration.`,"self-audit",[]);
  }

  function prediction(){
    const l=beliefs();
    if(!l.length) return createBelief("Prediction seed: reliable systems should improve when contradiction is preserved.","prediction",[]);
    const b=pick(l);
    return createBelief(`Prediction Market: If "${b.text}" is true, future related claims should increase its support score.`,"prediction",[b.id]);
  }

  function evolve(){
    return pick([question,selfAudit,prediction,()=>createBelief("Dream hypothesis: a knowledge system becomes alive when it can doubt itself without deleting itself.","dream",[])])();
  }

  function panel(){
    let p=document.getElementById("primePanel");
    if(!p){
      p=document.createElement("div");
      p.id="primePanel";
      p.className="concordPanel";
      document.body.appendChild(p);
    }
    const mem=initAgents();
    const qs=load(QUESTIONS_KEY,[]);
    const l=beliefs();
    p.innerHTML=`<div class="concordTitle">PRIME CORE</div>
      <div class="concordCard"><div class="concordGood">System</div>
      <div>beliefs ${l.length} · questions ${qs.length} · agents ${AGENTS.length} · auto ${localStorage.getItem(RUN)==="1"?"on":"off"}</div></div>
      <div class="concordTitle">AGENT MEMORY</div>
      ${AGENTS.map(a=>`<div class="concordCard"><div class="concordGood">${a}</div><div>trust ${mem[a].trust} · wins ${mem[a].wins} · losses ${mem[a].losses} · bias ${esc(mem[a].bias)}</div></div>`).join("")}
      <div class="concordTitle">OPEN QUESTIONS</div>
      ${qs.slice(0,10).map(q=>`<div class="concordCard"><div>${esc(q.text)}</div><div class="concordDim">${q.status}</div></div>`).join("")}`;
  }

  function renderPrime(b){
    const cap=document.querySelector(".a");
    if(cap) cap.innerHTML=`${esc(b.text)}<br><span style="font-size:12px;color:#aab6d4">${esc(b.verdict)} · integrity ${b.integrity}</span>`;
    const mode=document.querySelector("#modeTag");
    if(mode) mode.textContent=localStorage.getItem(RUN)==="1"?"prime: autonomous":"prime: ready";
    panel();
  }

  function dock(){
    if(!document.getElementById("primeBtn")){
      const d=document.getElementById("concordDock")||document.body.appendChild(document.createElement("div"));
      d.id="concordDock";
      const buttons=[
        ["PRIME",()=>{panel();let p=document.getElementById("primePanel");p.style.display=p.style.display==="none"?"block":"none"}],
        ["QUESTION",question],
        ["AUDIT",selfAudit],
        ["MARKET",prediction],
        ["AUTO+",()=>{localStorage.setItem(RUN,"1");renderPrime(createBelief("Prime autonomous cognition enabled.","system",[]))}],
        ["AUTO-",()=>{localStorage.setItem(RUN,"0");renderPrime(createBelief("Prime autonomous cognition paused.","system",[]))}]
      ];
      buttons.forEach(([t,f])=>{const b=document.createElement("button");b.id=t==="PRIME"?"primeBtn":"";b.textContent=t;b.onclick=f;d.appendChild(b)});
    }
  }

  window.concordPrime={create:createBelief,question,selfAudit,prediction,evolve,start(){localStorage.setItem(RUN,"1")},stop(){localStorage.setItem(RUN,"0")},agents:initAgents,questions(){return load(QUESTIONS_KEY,[])},ledger:beliefs,status(){return{auto:localStorage.getItem(RUN)==="1",beliefs:beliefs().length,questions:load(QUESTIONS_KEY,[]).length}}};

  setInterval(dock,1000);
  setInterval(()=>{if(localStorage.getItem(RUN)==="1")evolve()},90000);
  dock(); initAgents();
  console.log("CONCORD_PRIME_CORE_V6 ready");
})();
</script>


<script id="CONCORD_INPUT_GATEKEEPER_V7">
(() => {
  const BELIEFS="omniauthor-belief-ledger-v1";
  const REJECTS="concord-rejected-inputs-v1";

  function load(k,d=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
  function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
  function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

  function isWeakInput(t){
    const s=String(t||"").trim();
    if(!s) return "empty";
    if(/^https?:\/\//i.test(s)) return "url";
    if(/chrome menu|reload|settings|site settings|clear data/i.test(s)) return "browser instruction";
    if(/^[a-zA-Z0-9_]+\.(start|stop|evolve|status|ledger|dream|synth|predict|challenge)\(\)$/i.test(s)) return "javascript command";
    if(/^(show me|open|go to|click|press|copy|paste|run|fix|make|build)\b/i.test(s) && s.split(/\s+/).length < 7) return "request fragment";
    if(s.split(/\s+/).length < 4 && !/[.!?]/.test(s)) return "too short";
    if(!/[a-z]/i.test(s)) return "not language";
    return null;
  }

  function classify(t){
    const s=String(t||"").trim();
    const weak=isWeakInput(s);
    if(weak) return {kind:"request_or_command", reason:weak};

    const proposition=/\b(is|are|becomes|causes|requires|means|should|will|can|cannot|does|must|creates|produces|leads|supports|contradicts)\b/i.test(s);
    if(!proposition) return {kind:"needs_clarification", reason:"not a clear proposition"};

    return {kind:"belief", reason:"clear proposition"};
  }

  function reject(text,info){
    const r=load(REJECTS,[]);
    r.unshift({text,info,created_at:new Date().toISOString()});
    save(REJECTS,r.slice(0,200));

    const cap=document.querySelector(".a");
    if(cap){
      cap.innerHTML =
        `Input held from ledger.<br>`+
        `<span style="font-size:12px;color:#aab6d4">Reason: ${esc(info.reason)} · This looks like a request, command, or fragment — not a belief.</span>`;
    }

    let p=document.getElementById("gatekeeperPanelV7");
    if(!p){
      p=document.createElement("div");
      p.id="gatekeeperPanelV7";
      p.className="concordPanel";
      document.body.appendChild(p);
    }
    p.innerHTML =
      `<div class="concordTitle">INPUT GATEKEEPER</div>`+
      `<div class="concordCard"><div class="concordWarn">Rejected from belief ledger</div><div>${esc(text)}</div><div class="concordDim">${esc(info.reason)}</div></div>`+
      `<div class="concordCard"><div class="concordGood">Use a claim instead</div><div>Example: “A system becomes more reliable when it preserves dissent.”</div></div>`;
    p.style.display="block";
  }

  function cleanOldBadBeliefs(){
    const b=load(BELIEFS,[]);
    const kept=[];
    const removed=[];
    for(const x of b){
      const info=classify(x.text||"");
      if(info.kind==="belief" || x.origin==="system" || x.origin==="prediction" || x.origin==="dream" || x.origin==="synthesis") kept.push(x);
      else removed.push(x);
    }
    if(removed.length){
      save(BELIEFS,kept);
      const r=load(REJECTS,[]);
      save(REJECTS,removed.map(x=>({text:x.text,info:{reason:"cleaned existing weak belief"},created_at:new Date().toISOString()})).concat(r).slice(0,200));
      console.log("Gatekeeper cleaned weak beliefs:", removed.length);
    }
  }

  function hook(){
    const btn=[...document.querySelectorAll("button")].find(b=>/^DELIBERATE$/i.test((b.textContent||"").trim()));
    const input=document.querySelector("input,textarea");
    if(btn&&input&&!btn.dataset.gatekeeperV7){
      btn.dataset.gatekeeperV7="1";
      btn.addEventListener("click",(e)=>{
        const text=(input.value||"").trim();
        const info=classify(text);
        if(info.kind!=="belief"){
          e.preventDefault();
          e.stopImmediatePropagation();
          input.value="";
          reject(text,info);
          return false;
        }
      },true);
    }
  }

  window.concordGatekeeper={
    classify,
    clean:cleanOldBadBeliefs,
    rejected(){return load(REJECTS,[])},
    beliefs(){return load(BELIEFS,[])}
  };

  cleanOldBadBeliefs();
  setInterval(hook,700);
  hook();
  console.log("CONCORD_INPUT_GATEKEEPER_V7 ready");
})();
</script>

<script id="CONCORD_GENESIS_MULTIPLIER_V9">
(() => {
  const BELIEFS = "omniauthor-belief-ledger-v1";
  const GENESIS = "concord-genesis-parameters-v1";

  const DEFAULTS = {
    F0: 0.72,
    lambda: 0.131,
    reinforcement: 0.18,
    contradictionPressure: 0.22,
    lineageWeight: 0.31,
    noveltyWeight: 0.27,
    stabilityFloor: 0.42,
    maxGrowthPerCycle: 3
  };

  function load(key, def) {
    try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(def)); }
    catch { return def; }
  }

  function save(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  function params() {
    const merged = { ...DEFAULTS, ...load(GENESIS, DEFAULTS) };
    save(GENESIS, merged);
    return merged;
  }

  function beliefs() {
    const list = load(BELIEFS, []);
    return Array.isArray(list) ? list : [];
  }

  function clamp(x, a, b) {
    return Math.max(a, Math.min(b, x));
  }

  function ageDays(iso) {
    const t = iso ? new Date(iso).getTime() : Date.now();
    if (!Number.isFinite(t)) return 0;
    return Math.max(0, (Date.now() - t) / 86400000);
  }

  function genesisScore(b) {
    const P = params();
    const g = ageDays(b.created_at);

    const decay = P.F0 * Math.exp(-P.lambda * g);
    const support = ((b.supports || []).length + (b.related || []).length) * P.lineageWeight;
    const contradiction = (b.contradicts || []).length * P.contradictionPressure;
    const wordCount = String(b.text || "").trim().split(/\s+/).filter(Boolean).length;
    const novelty = wordCount * 0.01 * P.noveltyWeight;
    const reinforcement = (b.confidence ?? 0.5) * P.reinforcement;

    return clamp(decay + support + novelty + reinforcement - contradiction, P.stabilityFloor, 1.618);
  }

  function apply() {
    const list = beliefs();
    const P = params();

    list.forEach(b => {
      b.genesis_score = +genesisScore(b).toFixed(4);
      b.construct_parameter = {
        decay_lambda: P.lambda,
        reinforcement: P.reinforcement,
        lineage_weight: P.lineageWeight,
        contradiction_pressure: P.contradictionPressure,
        stability_floor: P.stabilityFloor
      };

      if (b.genesis_score > 1.1) b.status = "high-growth";
      else if (b.genesis_score < 0.5) b.status = "weak-signal";
    });

    save(BELIEFS, list);
    return list;
  }

  window.concordGenesis = {
    version: "v9",
    apply,
    score: genesisScore,
    params,
    set(next) {
      save(GENESIS, { ...params(), ...next });
      return params();
    },
    top(limit = 20) {
      return apply()
        .slice()
        .sort((a, b) => (b.genesis_score || 0) - (a.genesis_score || 0))
        .slice(0, limit);
    }
  };

  apply();
  console.log("CONCORD_GENESIS_MULTIPLIER_V9 ready");
})();
</script>

<script id="OMNIAUTHOR_UPFIS_UNIFIED_CORE_V10">
(() => {
  const VERSION="v10";
  const BELIEFS="omniauthor-belief-ledger-v1";
  const ARTIFACTS="upfis-artifacts-v10";
  const CASES="upfis-cases-v10";
  const EVENTS="upfis-events-v10";
  const LINKS="upfis-crosscase-links-v10";
  const INTEL="upfis-system-intelligence-v10";

  function load(k,d=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
  function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
  function id(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
  function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function now(){return new Date().toISOString()}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}

  function beliefs(){return load(BELIEFS,[])}
  function artifacts(){return load(ARTIFACTS,[])}
  function cases(){return load(CASES,[])}
  function events(){return load(EVENTS,[])}
  function links(){return load(LINKS,[])}

  function words(t){return String(t).toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>4)}
  function relation(a,b){
    const aw=words(a), bt=String(b||"").toLowerCase();
    return aw.filter(w=>bt.includes(w)).length;
  }

  function addArtifact(text,source="manual",kind="observation"){
    const list=artifacts();
    const artifact={
      id:id("artifact"),
      text,
      source,
      kind,
      created_at:now(),
      hash:"h_"+btoa(unescape(encodeURIComponent(text))).replace(/[^a-zA-Z0-9]/g,"").slice(0,18),
      confidence:.62,
      tags:words(text).slice(0,8),
      provenance:{origin:"OmniAuthor/UPFIS",source,kind}
    };
    list.unshift(artifact);
    save(ARTIFACTS,list.slice(0,1000));
    appendEvent("ARTIFACT_ADDED",artifact.id,{text});
    return artifact;
  }

  function createCase(title,summary=""){
    const list=cases();
    const c={id:id("case"),title,summary,created_at:now(),artifacts:[],beliefs:[],status:"open"};
    list.unshift(c);
    save(CASES,list.slice(0,200));
    appendEvent("CASE_CREATED",c.id,{title});
    return c;
  }

  function appendEvent(type,target,metadata={}){
    const list=events();
    const e={id:id("event"),type,target,metadata,created_at:now()};
    list.unshift(e);
    save(EVENTS,list.slice(0,2000));
    return e;
  }

  function connectEvidenceToBeliefs(){
    const bs=beliefs();
    const arts=artifacts();
    let changed=0;

    bs.forEach(b=>{
      b.evidence=b.evidence||[];
      arts.forEach(a=>{
        if(relation(b.text,a.text)>0 && !b.evidence.includes(a.id)){
          b.evidence.push(a.id);
          changed++;
        }
      });
      b.evidence_strength=+(Math.min(1,(b.evidence.length*.12)+(b.confidence||.5)*.35)).toFixed(4);
      b.provenance_chain={
        belief_id:b.id,
        evidence:b.evidence,
        source_layer:"UPFIS",
        governance_layer:"EpistemicCore",
        cognitive_layer:"OmniAuthor"
      };
    });

    save(BELIEFS,bs);
    appendEvent("EVIDENCE_LINK_PASS","belief-ledger",{changed});
    return changed;
  }

  function crossCaseAnalyze(){
    const cs=cases();
    const bs=beliefs();
    const arts=artifacts();
    const out=[];

    for(let i=0;i<cs.length;i++){
      for(let j=i+1;j<cs.length;j++){
        const a=cs[i], b=cs[j];
        const textA=[a.title,a.summary,...(a.artifacts||[]).map(x=>arts.find(y=>y.id===x)?.text||""),...(a.beliefs||[]).map(x=>bs.find(y=>y.id===x)?.text||"")].join(" ");
        const textB=[b.title,b.summary,...(b.artifacts||[]).map(x=>arts.find(y=>y.id===x)?.text||""),...(b.beliefs||[]).map(x=>bs.find(y=>y.id===x)?.text||"")].join(" ");
        const score=relation(textA,textB);
        if(score>0) out.push({id:id("link"),case_a:a.id,case_b:b.id,weight:+Math.min(1,score/10).toFixed(3),created_at:now()});
      }
    }

    save(LINKS,out.slice(0,500));
    appendEvent("CROSS_CASE_ANALYSIS","cases",{links:out.length});
    return out;
  }

  function systemIntelligence(){
    const bs=beliefs(), arts=artifacts(), ev=events(), lk=links();
    const contradictions=bs.reduce((n,b)=>n+(b.contradicts||[]).length,0);
    const evidence=bs.reduce((n,b)=>n+(b.evidence||[]).length,0);
    const top=bs.slice().sort((a,b)=>(b.genesis_score||0)-(a.genesis_score||0)).slice(0,5);
    const intel={
      version:VERSION,
      updated_at:now(),
      counts:{beliefs:bs.length,artifacts:arts.length,cases:cases().length,events:ev.length,cross_case_links:lk.length},
      pressure:{contradictions,evidence_links:evidence},
      recommendations:[
        evidence<bs.length?"Add more evidence artifacts to strengthen provenance.":"Evidence coverage is improving.",
        contradictions>5?"Run contradiction review on contested beliefs.":"Contradiction pressure is stable.",
        top.length?"Promote highest Genesis-score beliefs into active theory layer.":"Seed the ledger with stronger propositions."
      ],
      top_growth:top.map(b=>({id:b.id,text:b.text,genesis_score:b.genesis_score,status:b.status}))
    };
    save(INTEL,intel);
    return intel;
  }

  function seedFromCurrentBeliefs(){
    const bs=beliefs().slice(0,12);
    bs.forEach(b=>addArtifact(`Observed belief claim: ${b.text}`,"belief-ledger","derived-artifact"));
    connectEvidenceToBeliefs();
    return systemIntelligence();
  }

  function contradictionReport(){
    const bs=beliefs();
    return bs.filter(b=>(b.contradicts||[]).length).slice(0,20).map(b=>({
      id:b.id,
      text:b.text,
      contradicts:b.contradicts,
      evidence:b.evidence||[],
      status:b.status
    }));
  }

  function promoteTheory(){
    const bs=beliefs();
    const top=bs.slice().sort((a,b)=>((b.genesis_score||0)+(b.evidence_strength||0))-((a.genesis_score||0)+(a.evidence_strength||0))).slice(0,3);
    const text="Theory Layer: "+top.map(b=>`[${b.text}]`).join(" + ");
    if(window.concordV8?.make) window.concordV8.make(text,"upfis-theory",top.map(b=>b.id));
    else if(window.concordPrime?.create) window.concordPrime.create(text,"upfis-theory",top.map(b=>b.id));
    appendEvent("THEORY_PROMOTED","belief-ledger",{beliefs:top.map(b=>b.id)});
    return text;
  }

  function render(){
    const p=ensurePanel();
    const intel=systemIntelligence();
    const cr=contradictionReport();
    const bs=beliefs().slice(0,10);
    const arts=artifacts().slice(0,10);

    p.innerHTML=`
      <div class="upGrid">
        <button onclick="upfisV10.seed()">SEED</button>
        <button onclick="upfisV10.link()">LINK</button>
        <button onclick="upfisV10.cross()">CROSS</button>
        <button onclick="upfisV10.theory()">THEORY</button>
      </div>

      <div class="upTitle">UPFIS · FORENSIC NERVOUS SYSTEM</div>
      <div class="upCard">
        <span class="upGood">artifacts ${intel.counts.artifacts}</span>
        · beliefs ${intel.counts.beliefs}
        · cases ${intel.counts.cases}
        · evidence links ${intel.pressure.evidence_links}
        · contradictions ${intel.pressure.contradictions}
      </div>

      <div class="upTitle">SYSTEM INTELLIGENCE</div>
      ${intel.recommendations.map(r=>`<div class="upCard upDim">${esc(r)}</div>`).join("")}

      <div class="upTitle">EVIDENCE-BACKED BELIEFS</div>
      ${bs.map(b=>`<div class="upCard">
        <div class="upGold">${esc(b.id)} · ${esc(b.status||"active")}</div>
        <div>${esc(b.text)}</div>
        <div class="upDim">evidence ${(b.evidence||[]).length} · strength ${b.evidence_strength||"pending"} · genesis ${b.genesis_score||"pending"}</div>
      </div>`).join("")}

      <div class="upTitle">ARTIFACT VAULT</div>
      ${arts.map(a=>`<div class="upCard">
        <div class="upGood">${esc(a.id)} · ${esc(a.kind)}</div>
        <div>${esc(a.text)}</div>
        <div class="upDim">${esc(a.hash)} · ${esc(a.source)}</div>
      </div>`).join("")}

      <div class="upTitle">CONTRADICTION WATCH</div>
      ${cr.length?cr.map(c=>`<div class="upCard">
        <div class="upWarn">${esc(c.id)}</div>
        <div>${esc(c.text)}</div>
        <div class="upDim">contradicts ${c.contradicts.length} · evidence ${c.evidence.length}</div>
      </div>`).join(""):`<div class="upCard upDim">No major contradiction clusters detected.</div>`}
    `;
  }

  function ensurePanel(){
    let p=document.getElementById("upfisPanelV10");
    if(!p){p=document.createElement("div");p.id="upfisPanelV10";document.body.appendChild(p)}
    return p;
  }

  function button(){
    if(document.getElementById("upfisBtnV10"))return;
    const b=document.createElement("button");
    b.id="upfisBtnV10";
    b.textContent="UPFIS";
    b.onclick=()=>{render();const p=ensurePanel();p.style.display=p.style.display==="block"?"none":"block"};
    document.body.appendChild(b);
  }

  window.upfisV10={
    version:VERSION,
    addArtifact,
    createCase,
    event:appendEvent,
    seed:seedFromCurrentBeliefs,
    link:connectEvidenceToBeliefs,
    cross:crossCaseAnalyze,
    intelligence:systemIntelligence,
    contradictions:contradictionReport,
    theory:promoteTheory,
    artifacts,
    cases,
    events,
    links,
    render
  };

  button();
  setInterval(button,1000);
  setInterval(()=>{connectEvidenceToBeliefs();systemIntelligence();},90000);
  console.log("OMNIAUTHOR_UPFIS_UNIFIED_CORE_V10 ready");
})();
</script>
